# Teste temporário: o GitHub consegue abrir os portais da NFC-e?
name: Teste SEFAZ
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          nota() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-900)"; }
          nota "local: $(curl -s -m 10 https://ipinfo.io/json | tr -d '\n ' | grep -oE '"(city|country|org)":"[^"]*"' | tr '\n' ' ')"
          r=$(curl -sSk -m 40 -D /tmp/h.txt -o /tmp/d.html -w 'HTTP %{http_code} %{time_total}s' 'https://nfce.set.rn.gov.br/consultarNFCe.aspx?p=24261014224420000166650010000103591869962609%7C3%7C1' 2>&1); nota "RN antigo -k sem seguir: $r | $(grep -i '^location' /tmp/h.txt) | $(echo | openssl s_client -connect nfce.set.rn.gov.br:443 -servername nfce.set.rn.gov.br 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ')"
          r=$(curl -sSk -m 60 -L -o /tmp/e.html -w 'HTTP %{http_code} %{time_total}s %{url_effective}' 'https://nfce.set.rn.gov.br/consultarNFCe.aspx?p=24261014224420000166650010000103591869962609%7C3%7C1' 2>&1); nota "RN antigo -k seguindo: $r | $(sed -e 's/<[^>]*>/ /g' /tmp/e.html 2>/dev/null | tr -s ' \n\r\t' ' ' | grep -oE 'MARSEL.{0,300}' | head -c 400)"

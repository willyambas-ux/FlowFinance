# Teste temporário: o GitHub consegue abrir os portais da NFC-e?
name: Teste SEFAZ
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          nota() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-900)"; }
          nota "local: $(curl -s -m 10 https://ipinfo.io/json | tr -d '\n ' | grep -oE '"(city|country|org)":"[^"]*"' | tr '\n' ' ')"
          r=$(curl -sS -m 40 -o /tmp/a.html -w 'HTTP %{http_code} %{time_total}s' 'https://nfce.sefaz.rn.gov.br/portalDFE/NFCe/mDadosNFCe.aspx?p=1' 2>&1); nota "RN novo mDados: $r | $(head -c 200 /tmp/a.html 2>/dev/null | tr -s ' \n' ' ')"
          r=$(curl -sS -m 40 -L -o /tmp/b.html -w 'HTTP %{http_code} %{time_total}s %{url_effective}' 'https://nfce.sefaz.rn.gov.br/consultarNFCe.aspx?p=1' 2>&1); nota "RN novo consultar: $r | $(head -c 200 /tmp/b.html 2>/dev/null | tr -s ' \n' ' ')"
          printf 'openssl_conf = c\n[c]\nssl_conf = s\n[s]\nsystem_default = d\n[d]\nMinProtocol = TLSv1\nCipherString = DEFAULT@SECLEVEL=0\nOptions = UnsafeLegacyRenegotiation\n' > /tmp/ossl.cnf
          r=$(OPENSSL_CONF=/tmp/ossl.cnf curl -sS -m 40 -L -o /tmp/c.html -w 'HTTP %{http_code} %{time_total}s' 'https://nfce.set.rn.gov.br/consultarNFCe.aspx?p=1' 2>&1); nota "RN antigo TLS legado: $r | $(head -c 200 /tmp/c.html 2>/dev/null | tr -s ' \n' ' ')"
          r=$(echo | timeout 20 openssl s_client -connect nfce.set.rn.gov.br:443 -servername nfce.set.rn.gov.br 2>&1 | grep -E 'Protocol|Cipher is|alert|errno|error' | head -4); nota "TLS RN antigo: $r"

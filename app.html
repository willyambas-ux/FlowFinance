let _importLancs = [];

function _importDestino_() {
  const v = $('#import-destino') ? $('#import-destino').value : '';
  if (v.indexOf('k:') === 0) return { tipo: 'cartao', id: v.slice(2) };
  if (v.indexOf('c:') === 0) return { tipo: 'conta',  id: v.slice(2) };
  return { tipo: '', id: '' };
}

async function initImportar() {
  showLoader(true);
  try {
    await loadAux();
    const sel = $('#import-destino');
    const contas  = State.cache.contas  || [];
    const cartoes = State.cache.cartoes || [];
    let html = '<option value="">— selecione —</option>';
    if (contas.length) {
      html += '<optgroup label="Contas">' +
        contas.map(c => '<option value="c:' + escapeHtml(c.id) + '">' + escapeHtml(c.nome) + '</option>').join('') +
        '</optgroup>';
    }
    if (cartoes.length) {
      html += '<optgroup label="Cartões">' +
        cartoes.map(c => '<option value="k:' + escapeHtml(c.id) + '">' + escapeHtml(c.nome) + '</option>').join('') +
        '</optgroup>';
    }
    sel.innerHTML = html;

    sel.onchange = () => {
      const d = _importDestino_();
      const ehCartao = d.tipo === 'cartao';
      $('#import-modo-fatura').classList.toggle('hidden', !ehCartao);
      $('#import-row-competencia').classList.toggle('hidden', !ehCartao);
      // muda a análise se já tinha algo
      $('#btn-import-confirmar').disabled = true;
      $('#import-preview-card').style.display = 'none';
      _importLancs = [];
    };

    $('#btn-import-analisar').onclick = analisarImport_;
    $('#btn-import-confirmar').onclick = confirmarImport_;
    $('#import-csv').oninput = () => {
      $('#btn-import-confirmar').disabled = true;
      $('#import-preview-card').style.display = 'none';
      _importLancs = [];
    };
    // "Aplicar a todas": joga a competência do topo em todas as linhas
    const btnAplicarComp = $('#import-competencia-aplicar');
    if (btnAplicarComp) btnAplicarComp.onclick = () => {
      const comp = $('#import-competencia').value || '';
      (_importLancs || []).forEach(l => { if (!l._pagamento) l.fatura_competencia = comp; });
      // atualiza os inputs por linha já renderizados
      $$('#import-preview-body .import-fatura').forEach(inp => { inp.value = comp; });
      if (comp) toast('Competência ' + comp + ' aplicada a todas as linhas.');
      else toast('Competência limpa — cada linha usa a fatura pela data.');
    };
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

async function analisarImport_() {
  const dest = _importDestino_();
  const csv = $('#import-csv').value;
  if (!dest.id) return toast('Selecione a conta ou cartão de destino.', true);
  if (!csv.trim()) return toast('Cole o conteúdo antes de analisar.', true);

  showLoader(true);
  try {
    const parsed = await run('previewImportacao', csv, { tipo: dest.tipo, id: dest.id });
    _importLancs = parsed.lancs || [];
    renderImportPreview_(_importLancs); // cuida do botão confirmar e dos checkboxes
    const pagamentos = _importLancs.filter(l => l._pagamento).length;
    const dups = _importLancs.filter(l => l._duplicado).length;
    $('#import-summary').textContent =
      _importLancs.length + ' linha(s)' +
      (pagamentos > 0 ? ' · ' + pagamentos + ' pagamento/crédito' : '') +
      (dups > 0 ? ' · ' + dups + ' duplicado(s) desmarcado(s)' : '') +
      (parsed.modo_fatura ? ' · modo fatura' : '');
    const fmtEl = $('#import-formato');
    if (fmtEl) fmtEl.textContent = parsed.formato ? 'Formato detectado: ' + parsed.formato : '';
  } catch (e) {
    toast(e.message, true);
    _importLancs = [];
    $('#btn-import-confirmar').disabled = true;
    $('#import-preview-card').style.display = 'none';
  } finally {
    showLoader(false);
  }
}

/** Opts hierárquicas (pais primeiro, subs com indent) para o combobox de categoria. */
function _importCatOpts_() {
  const all = State.cache.categorias || [];
  const byName = (a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
  const pais = all.filter(c => !c.pai).sort(byName);
  const filhosPorPai = {};
  all.filter(c => c.pai).forEach(c => { (filhosPorPai[c.pai] = filhosPorPai[c.pai] || []).push(c); });
  const opts = [];
  pais.forEach(p => {
    opts.push({ value: p.id, label: p.nome, indent: false, searchText: p.nome });
    (filhosPorPai[p.id] || []).sort(byName).forEach(f =>
      opts.push({ value: f.id, label: f.nome, indent: true, searchText: p.nome + ' ' + f.nome }));
  });
  const paisIds = new Set(pais.map(p => p.id));
  all.filter(c => c.pai && !paisIds.has(c.pai)).forEach(f => {
    opts.push({ value: f.id, label: f.nome, indent: false, searchText: f.nome });
  });
  return opts;
}
function _importCentroOpts_() {
  return (State.cache.centros || [])
    .slice().sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR'))
    .map(c => ({ value: c.id, label: c.nome, indent: false, searchText: c.nome }));
}

/**
 * Combobox leve com lazy-render: a lista só popula quando o input ganha foco,
 * e esvazia ao fechar. Permite ter 100+ combos sem encher o DOM.
 */
function _setupMiniCombo_(input, list, opts, onPick) {
  const render = (filter) => {
    const flt = String(filter || '').trim().toLowerCase();
    const filtered = flt
      ? opts.filter(o => !o.header && (
          String(o.label).toLowerCase().indexOf(flt) !== -1 ||
          (o.searchText && String(o.searchText).toLowerCase().indexOf(flt) !== -1)
        ))
      : opts;
    list.innerHTML = filtered.length
      ? filtered.map(o => o.header
          ? '<div class="cb-header">' + escapeHtml(o.label) + '</div>'
          : '<div class="cb-option' + (o.indent ? ' cb-indent' : '') +
            '" data-val="' + escapeHtml(o.value) + '" data-label="' + escapeHtml(o.label) + '">' +
            escapeHtml(o.label) + '</div>'
        ).join('')
      : '<div class="cb-empty">Sem opções</div>';
  };
  const open  = () => { render(input.value); list.classList.remove('hidden'); };
  const close = () => { list.classList.add('hidden'); list.innerHTML = ''; };

  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('blur',  () => setTimeout(close, 150));
  list.addEventListener('mousedown', (e) => {
    const opt = e.target.closest('.cb-option');
    if (!opt) return;
    e.preventDefault(); // mantém foco até o pick rodar
    input.value = opt.dataset.label;
    onPick(opt.dataset.val);
    close();
  });
}

/** Mapeia um nome digitado pelo usuário → id (case-insensitive). Vazio se não achar. */
function _idByName_(list, nome) {
  if (!nome) return '';
  const n = String(nome).trim().toLowerCase();
  const item = (list || []).find(x => String(x.nome || '').toLowerCase() === n);
  return item ? item.id : '';
}
/** id → nome. Diferente de `nameOf` que faz fallback pro próprio id quando não acha. */
function _nameById_(list, id) {
  if (!id) return '';
  const item = (list || []).find(x => String(x.id) === String(id));
  return item ? item.nome : '';
}

function renderImportPreview_(lancs) {
  const body = $('#import-preview-body');
  body.innerHTML = '';
  $('#import-preview-card').style.display = lancs.length > 0 ? '' : 'none';
  // Opts pré-calculadas uma vez por render (compartilhadas entre todos os combos)
  const catOpts    = _importCatOpts_();
  const centroOpts = _importCentroOpts_();
  // Coluna de fatura/competência só aparece quando o destino é cartão
  const ehCartao = _importDestino_().tipo === 'cartao';
  const thFatura = document.querySelector('.import-preview-table .import-col-fatura');
  if (thFatura) thFatura.classList.toggle('hidden', !ehCartao);

  // Só duplicados começam desmarcados. Pagamentos vêm marcados (entram como crédito).
  lancs.forEach(l => {
    l._ignorar = !!l._duplicado;
  });

  const nDup = lancs.filter(l => l._duplicado).length;
  const aviso = $('#import-dup-aviso');
  if (aviso) {
    aviso.innerHTML = nDup > 0
      ? nDup + ' possível(is) duplicado(s) — desmarcado(s) automaticamente. ' +
        '<span style="font-weight:400">Confira o lançamento existente abaixo de cada um e marque o checkbox se quiser importar mesmo assim.</span>'
      : '';
    aviso.style.color = nDup > 0 ? 'var(--warning)' : '';
  }

  lancs.forEach((l, idx) => {
    const v = Number(l.valor) || 0;
    const parc = (l.parcela_atual && l.parcela_total)
      ? (l.parcela_atual + '/' + l.parcela_total) : '—';
    const tr = document.createElement('tr');
    if (l._ignorar) tr.className = 'import-row-ignorada';

    let tags = '';
    if (l._pagamento) tags += ' <span class="tag-import tag-pagamento">pagamento/crédito</span>';
    if (l._duplicado) tags += ' <span class="tag-import tag-duplicado">já existe</span>';

    // Detalhe do(s) lançamento(s) existente(s) que bateram — só mostra se duplicado
    let dupDetalhe = '';
    if (l._duplicado && l._dup_existentes && l._dup_existentes.length > 0) {
      const partes = l._dup_existentes.slice(0, 2).map(e => {
        const onde = e.cartao_nome ? ('cartão ' + e.cartao_nome) : (e.conta_nome ? ('conta ' + e.conta_nome) : '');
        const cat  = e.categoria_nome ? ('cat: ' + e.categoria_nome) : '';
        const v    = Number(e.valor) || 0;
        const partes2 = [
          fmtDateBR_(e.data),
          fmtBRL(v),
          onde,
          cat,
          e.status,
          e.origem === 'importacao' ? 'importado' : ''
        ].filter(x => x);
        return partes2.join(' · ');
      });
      let extra = '';
      if (l._dup_existentes.length > 2) {
        extra = ' (+' + (l._dup_existentes.length - 2) + ' outro(s))';
      }
      dupDetalhe = '<div class="dup-existente"><span class="material-icons-outlined" style="font-size:12px;vertical-align:middle">history</span> ' +
                   'Já existe: ' + escapeHtml(partes.join(' | ')) + escapeHtml(extra) + '</div>';
    }

    const catNome    = _nameById_(State.cache.categorias, l.categoria);
    const centroNome = _nameById_(State.cache.centros,    l.centro);
    const catCell =
      '<div class="import-cell-with-btn">' +
        '<div class="combobox cb-mini">' +
          '<input type="text" class="cb-input import-cat" data-idx="' + idx + '" value="' + escapeHtml(catNome) + '" placeholder="Pesquisar..." autocomplete="off">' +
          '<div class="cb-list hidden"></div>' +
        '</div>' +
        '<button type="button" class="import-rule-btn icon-btn" data-idx="' + idx + '" title="Criar regra automática a partir desta categoria/centro (aplica nas outras linhas)">' +
          '<span class="material-icons-outlined">auto_fix_high</span>' +
        '</button>' +
      '</div>';
    const centroCell =
      '<div class="combobox cb-mini">' +
        '<input type="text" class="cb-input import-centro" data-idx="' + idx + '" value="' + escapeHtml(centroNome) + '" placeholder="Pesquisar..." autocomplete="off">' +
        '<div class="cb-list hidden"></div>' +
      '</div>';

    const faturaCell = l._pagamento
      ? '<span class="muted">—</span>'
      : '<input type="month" class="import-fatura" data-idx="' + idx + '" value="' + escapeHtml(l.fatura_competencia || '') + '">';

    tr.innerHTML =
      '<td><input type="checkbox" class="import-check" data-idx="' + idx + '"' + (l._ignorar ? '' : ' checked') + '></td>' +
      '<td>' + fmtDate(l.data) + '</td>' +
      '<td>' + escapeHtml(l.descricao) + tags + dupDetalhe + '</td>' +
      '<td>' + catCell + '</td>' +
      '<td>' + centroCell + '</td>' +
      '<td>' + parc + '</td>' +
      '<td class="import-col-fatura' + (ehCartao ? '' : ' hidden') + '">' + faturaCell + '</td>' +
      '<td class="right ' + (v < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(v) + '</td>';
    body.appendChild(tr);
  });

  // Handler do input de competência por linha
  $$('.import-fatura', body).forEach(inp => {
    inp.onchange = () => { lancs[Number(inp.dataset.idx)].fatura_competencia = inp.value || ''; };
  });

  // Handlers: checkbox individual, select categoria/centro
  $$('.import-check', body).forEach(cb => {
    cb.onchange = () => {
      const i = Number(cb.dataset.idx);
      lancs[i]._ignorar = !cb.checked;
      cb.closest('tr').classList.toggle('import-row-ignorada', !cb.checked);
      _updateImportConfirmBtn_(lancs);
    };
  });
  function _bindImportCombo_(seletor, campo, opts, sourceList) {
    $$(seletor, body).forEach(inp => {
      const list = inp.parentElement.querySelector('.cb-list');
      const i = Number(inp.dataset.idx);
      _setupMiniCombo_(inp, list, opts, (value) => {
        lancs[i][campo] = value || '';
        _updateImportConfirmBtn_(lancs);
      });
      // Blur: se o texto digitado bate exatamente com um nome, aceita; senão limpa
      inp.addEventListener('blur', () => {
        setTimeout(() => {
          const nome = inp.value.trim();
          if (!nome) {
            lancs[i][campo] = '';
          } else {
            const id = _idByName_(sourceList, nome);
            if (id) {
              lancs[i][campo] = id;
              inp.value = _nameById_(sourceList, id);
            } else {
              // texto digitado não bate com nenhuma opção — limpa
              lancs[i][campo] = '';
            }
          }
          _updateImportConfirmBtn_(lancs);
        }, 200); // depois do mousedown da lista
      });
    });
  }
  _bindImportCombo_('.import-cat',    'categoria', catOpts,    State.cache.categorias);
  _bindImportCombo_('.import-centro', 'centro',    centroOpts, State.cache.centros);
  $$('.import-rule-btn', body).forEach(btn => {
    btn.onclick = () => _criarRegraDaLinha_(Number(btn.dataset.idx), lancs);
  });
  const checkAll = $('#import-check-all');
  if (checkAll) {
    checkAll.onchange = () => {
      $$('.import-check', body).forEach(cb => {
        if (cb.disabled) return;
        cb.checked = checkAll.checked;
        lancs[Number(cb.dataset.idx)]._ignorar = !checkAll.checked;
        cb.closest('tr').classList.toggle('import-row-ignorada', !checkAll.checked);
      });
      _updateImportConfirmBtn_(lancs);
    };
  }
  _updateImportConfirmBtn_(lancs);
}

/** Sugere uma palavra-chave a partir da descrição (primeira palavra significativa). */
function _sugerirPalavraChave_(desc) {
  const limpo = String(desc || '').replace(/\(\d+\/\d+\)\s*$/, '').trim();
  const palavras = limpo.split(/[\s*\-_.,;:|]+/).filter(p => p && p.length >= 3 && !/^\d+$/.test(p));
  return palavras[0] ? palavras[0].toUpperCase() : limpo.toUpperCase();
}

/** Cria regra(s) de categorização a partir da linha (categoria + centro se preenchidos). */
async function _criarRegraDaLinha_(idx, lancs) {
  const l = lancs[idx];
  if (!l) return;
  if (!l.categoria && !l.centro) {
    return toast('Escolha categoria ou centro nesta linha antes de criar a regra.', true);
  }
  const sugestao = _sugerirPalavraChave_(l.descricao);
  const kw = prompt(
    'Criar regra: SE a descrição CONTIVER esta palavra-chave, aplica categoria/centro automaticamente.\n\n' +
    'Edite se quiser (mantenha curto e específico):',
    sugestao
  );
  if (!kw || !kw.trim()) return;
  const kwTrim = kw.trim();

  showLoader(true);
  let criadas = 0, removidas = 0;
  try {
    if (l.categoria) {
      const r = await run('saveRegraSubstituindo', {
        condicao_campo: 'descricao', condicao_operador: 'contains', condicao_valor: kwTrim,
        acao_campo: 'categoria', acao_valor: l.categoria, prioridade: 0, ativo: true
      });
      criadas++;
      removidas += (r && r.removidas) || 0;
    }
    if (l.centro) {
      const r = await run('saveRegraSubstituindo', {
        condicao_campo: 'descricao', condicao_operador: 'contains', condicao_valor: kwTrim,
        acao_campo: 'centro', acao_valor: l.centro, prioridade: 0, ativo: true
      });
      criadas++;
      removidas += (r && r.removidas) || 0;
    }
    // Aplica a regra recém-criada nas linhas do preview que combinam (sobrescreve auto-categorização)
    const alterados = _aplicarRegraLocalmenteImport_(kwTrim, l.categoria, l.centro, lancs);
    _atualizarSelectsImport_(lancs, alterados);
    const partes = [criadas + ' regra(s) criada(s)'];
    if (removidas > 0) partes.push(removidas + ' antiga(s) substituída(s)');
    partes.push(alterados.length + ' linha(s) atualizada(s)');
    toast(partes.join(' — ') + '.');
    // Não limpa cache aqui: o backend lê regras direto da planilha em previewImportacao;
    // e o cache local de categorias/centros precisa ficar pra resolver nomes na tela.
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

/** Aplica uma regra "contém X → categoria/centro" nas linhas do preview.
 *  SOBRESCREVE valores existentes (a regra criada explicitamente pelo usuário tem prioridade
 *  sobre a auto-categorização que o backend aplicou). Retorna índices alterados. */
function _aplicarRegraLocalmenteImport_(kw, catId, centroId, lancs) {
  const needle = String(kw || '').toLowerCase();
  if (!needle) return [];
  const alterados = [];
  (lancs || []).forEach((l, i) => {
    if (l._ignorar) return;
    const desc = String(l.descricao || '').toLowerCase();
    if (desc.indexOf(needle) === -1) return;
    let mudou = false;
    if (catId    && l.categoria !== catId)    { l.categoria = catId;    mudou = true; }
    if (centroId && l.centro    !== centroId) { l.centro    = centroId; mudou = true; }
    if (mudou) alterados.push(i);
  });
  return alterados;
}

/** Atualiza APENAS os inputs das linhas listadas em `idxs`. Nunca toca em outras linhas
 *  (evita zerar campos que estavam OK por causa de cache stale ou ids fora do cache). */
function _atualizarSelectsImport_(lancs, idxs) {
  const body = $('#import-preview-body');
  if (!body) { _updateImportConfirmBtn_(lancs); return; }
  (idxs || []).forEach(i => {
    const l = lancs[i];
    if (!l) return;
    const inpCat = body.querySelector('.import-cat[data-idx="' + i + '"]');
    if (inpCat)    inpCat.value    = _nameById_(State.cache.categorias, l.categoria);
    const inpCen = body.querySelector('.import-centro[data-idx="' + i + '"]');
    if (inpCen)    inpCen.value    = _nameById_(State.cache.centros,    l.centro);
  });
  _updateImportConfirmBtn_(lancs); // recalcula realce e botão sobre o estado atual
}

function _updateImportConfirmBtn_(lancs) {
  const marcados = (lancs || []).filter(l => !l._ignorar);
  const semCat    = marcados.filter(l => !l.categoria).length;
  const semCentro = marcados.filter(l => !l.centro).length;
  const ok = marcados.length > 0 && semCat === 0 && semCentro === 0;
  $('#btn-import-confirmar').disabled = !ok;

  // Marca visualmente os campos sem valor válido (vazio OU texto inválido)
  const body = $('#import-preview-body');
  if (body) {
    const marcar = (seletor, campo) => {
      $$(seletor, body).forEach(inp => {
        const i = Number(inp.dataset.idx);
        const l = (lancs || [])[i];
        const obrig = l && !l._ignorar;
        inp.classList.toggle('import-falta', !!obrig && !l[campo]);
      });
    };
    marcar('.import-cat',    'categoria');
    marcar('.import-centro', 'centro');
  }

  const falta = $('#import-falta-aviso');
  if (falta) {
    if (semCat > 0 || semCentro > 0) {
      const partes = [];
      if (semCat > 0)    partes.push(semCat + ' sem categoria');
      if (semCentro > 0) partes.push(semCentro + ' sem centro');
      falta.textContent = 'Preencha pra liberar a importação: ' + partes.join(' · ') + '.';
      falta.classList.remove('hidden');
    } else {
      falta.classList.add('hidden');
    }
  }
}

async function confirmarImport_() {
  const dest = _importDestino_();
  const importaveis = _importLancs.filter(l => !l._ignorar);
  if (!dest.id || importaveis.length === 0) return;
  const alvoNome = dest.tipo === 'cartao' ? 'o cartão' : 'a conta';
  if (!confirm('Importar ' + importaveis.length + ' lançamento(s) para ' + alvoNome + ' selecionado?')) return;

  showLoader(true);
  try {
    const result = await run('importarLancamentos', { tipo: dest.tipo, id: dest.id, lancs: _importLancs });
    const futuras = Number(result.parcelas_futuras) || 0;
    const partes = [result.importados + ' lançamento(s) importado(s)'];
    if (futuras > 0)        partes.push(futuras + ' parcela(s) futura(s) gerada(s) automaticamente');
    if (result.ignorados)   partes.push(result.ignorados + ' ignorado(s)');
    toast(partes.join(' · ') + '.');
    $('#import-csv').value = '';
    $('#import-preview-card').style.display = 'none';
    $('#btn-import-confirmar').disabled = true;
    $('#import-summary').textContent = '';
    _importLancs = [];
    clearAuxCache();
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

async function fecharPosicao_() {
  const conta = $('#fech-conta').value;
  const data = $('#fech-data').value;
  const saldo = moneyInputValue_($('#fech-saldo'));
  const ajuste = $('#fech-ajuste').checked;
  if (!conta) return toast('Selecione a conta.', true);
  if (!data)  return toast('Informe a data.', true);
  if (!saldo && saldo !== 0) return toast('Informe o saldo real.', true);

  const unlock = lockSaveButtons_('#btn-fechar');
  showLoader(true);
  try {
    const r = await run('fecharPosicao', conta, data, saldo, ajuste);
    const txt =
      'Sistema: ' + fmtBRL(r.saldo_sistema) +
      ' • Real: ' + fmtBRL(r.saldo_real) +
      ' • Diferença: ' + fmtBRL(r.diferenca) +
      (r.ajuste_criado ? ' • Lançamento de ajuste criado.' : '');
    $('#fech-resultado').textContent = txt;
    toast('Fechamento registrado.');
    setMoneyInputValue_($('#fech-saldo'), 0); $('#fech-saldo').value = '';

async function renderHistoricoFechamentos_() {
  const body = $('#fech-historico-body');
  const empty = $('#fech-historico-empty');
  try {
    const list = await run('listFechamentos');
    body.innerHTML = '';
    empty.classList.toggle('hidden', list.length > 0);
    list.forEach(f => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + fmtDate(f.data) + '</td>' +
        '<td>' + escapeHtml(nameOf(State.cache.contas, f.conta)) + '</td>' +
        '<td class="right">' + fmtBRL(f.saldo_real) + '</td>' +
        '<td>' +
          '<div class="row-actions">' +
            '<button class="icon-btn" data-act="del" data-id="' + escapeHtml(f.id) + '" title="Excluir"><span class="material-icons-outlined">delete</span></button>' +
          '</div>' +
        '</td>';
      body.appendChild(tr);
    });

      const btn = e.target.closest('button[data-act="del"]');

        showLoader(true);
        await run('deleteFechamento', btn.dataset.id);

        await renderHistoricoFechamentos_();
      } catch (err) { toast(err.message, true); }
      finally { showLoader(false); }
    };
  } catch (e) {
    toast(e.message, true);
  }
}

const _movFiltro = {

  cartoes: null,   // Set de ids

async function initLancamentos() {

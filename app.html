    if (sidebarToggle && movLayout) {
      // Restaura preferência salva
      if (localStorage.getItem('mov-sidebar-collapsed') === '1') {
        movLayout.classList.add('sidebar-collapsed');
      }
      sidebarToggle.onclick = () => {
        const collapsed = movLayout.classList.toggle('sidebar-collapsed');
        try { localStorage.setItem('mov-sidebar-collapsed', collapsed ? '1' : '0'); } catch (e) {}
      };
    }

    // "Selecionar todos" do card de contas operacionais (só contas tipo != empréstimo)
    $('#mov-conta-all').onchange = (e) => {
      const opIds = (State.cache.contas || [])
        .filter(c => c.tipo !== 'emprestimo')
        .map(c => c.id);
      const set = _movFiltro.contas;
      if (e.target.checked) opIds.forEach(id => set.add(id));
      else                  opIds.forEach(id => set.delete(id));
      reloadLancamentos();
    };
    // "Selecionar todos" do card de passivos (cartões + contas empréstimo)
    const allPasCb = $('#mov-passivos-all');
    if (allPasCb) allPasCb.onchange = (e) => {
      const empIds  = (State.cache.contas  || []).filter(c => c.tipo === 'emprestimo').map(c => c.id);
      const cartIds = (State.cache.cartoes || []).map(c => c.id);
      if (e.target.checked) {
        empIds .forEach(id => _movFiltro.contas .add(id));
        cartIds.forEach(id => _movFiltro.cartoes.add(id));
      } else {
        empIds .forEach(id => _movFiltro.contas .delete(id));
        cartIds.forEach(id => _movFiltro.cartoes.delete(id));
      }
      reloadLancamentos();
    };

    $('#btn-novo-lancamento').onclick = () => openLancamentoModal(null);
    const btnTransf = $('#btn-nova-transferencia');
    if (btnTransf) btnTransf.onclick = openTransferenciaModal;
    const btnExp = $('#btn-export-lancamentos');
    if (btnExp) btnExp.onclick = exportLancamentosVisiveis_;

    // Navegador de mês embutido na tela
    const lblMes = $('#mov-mes-label');
    if (lblMes) lblMes.textContent = monthLabel(State.ano, State.mes);
    const btnMesPrev = $('#mov-mes-prev');
    const btnMesNext = $('#mov-mes-next');
    if (btnMesPrev) btnMesPrev.onclick = () => shiftMonth(-1);
    if (btnMesNext) btnMesNext.onclick = () => shiftMonth(1);

    await reloadLancamentos();
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function setupStatusPills_() {
  $$('.status-pill').forEach(p => {
    p.classList.toggle('active', _movFiltro.status.has(p.dataset.status));
    p.onclick = () => {
      const s = p.dataset.status;
      if (_movFiltro.status.has(s)) _movFiltro.status.delete(s);
      else _movFiltro.status.add(s);
      p.classList.toggle('active', _movFiltro.status.has(s));
      reloadLancamentos();
    };
  });
}

async function reloadLancamentos() {
  showLoader(true);
  try {
    const contasArr  = Array.from(_movFiltro.contas  || []);
    const cartoesArr = Array.from(_movFiltro.cartoes || []);
    const statusArr  = Array.from(_movFiltro.status);
    const view = await run('getMovimentacoesView', State.ano, State.mes, contasArr, statusArr, cartoesArr);
    State._lancsVisiveis = view.lancamentos;
    State._lancsContas = view.lancamentos_contas || [];
    renderContaSidebar_(view);
    renderOrcamentosSidebar_(view.orcamentos || []);
    renderLancamentos(view);
    renderCartoesTable_(view);
    // Card "Resultados" reflete SEMPRE o total do mês (não a seleção)
    renderResumo_(view.resumo);
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function renderContaSidebar_(view) {
  const contOp  = $('#mov-conta-items');
  const contPas = $('#mov-passivos-items');
  if (!contOp) return;

  const allContas  = State.cache.contas  || [];
  const allCartoes = State.cache.cartoes || [];
  const saldoMap = {};
  (view.saldos_contas  || []).forEach(s => { saldoMap['c:' + s.id] = s; });
  (view.saldos_cartoes || []).forEach(s => { saldoMap['k:' + s.id] = s; });

  // Marca cada conta e cada cartão com tipo+kind, ordena por tipo+nome
  const itensTodos = []
    .concat(allContas.map(c => ({ kind: 'conta',  tipo: c.tipo || 'outra', data: c })))
    .concat(allCartoes.map(c => ({ kind: 'cartao', tipo: 'cartao',          data: c })))
    .sort((a, b) => {
      const ia = CONTA_TIPO_ORDEM.indexOf(a.tipo); const ib = CONTA_TIPO_ORDEM.indexOf(b.tipo);
      const ta = ia === -1 ? 99 : ia;
      const tb = ib === -1 ? 99 : ib;
      if (ta !== tb) return ta - tb;
      return String(a.data.nome || '').localeCompare(String(b.data.nome || ''), 'pt-BR', { numeric: true });
    });

  // Passivos = cartões + contas tipo empréstimo. Operacionais = resto.
  const isPassivo = (it) => it.kind === 'cartao' || it.tipo === 'emprestimo';
  const itensOp       = itensTodos.filter(it => !isPassivo(it));
  const itensPassivos = itensTodos.filter(it =>  isPassivo(it));

  function renderItem_(container, it) {
    const c = it.data;
    const isCartao = it.kind === 'cartao';
    const filtroSet = isCartao ? _movFiltro.cartoes : _movFiltro.contas;
    const sel = filtroSet.has(c.id);
    const s = saldoMap[(isCartao ? 'k:' : 'c:') + c.id] || { confirmado: 0, projetado: 0 };
    // Cartão usa fatura_mes/saldo_devedor; conta usa confirmado/projetado
    const cVal = isCartao ? (Number(s.fatura_mes)    || 0) : (Number(s.confirmado) || 0);
    const pVal = isCartao ? (Number(s.saldo_devedor) || 0) : (Number(s.projetado)  || 0);
    const cClass = cVal > 0 ? 'positive-val' : (cVal < 0 ? 'negative-val' : '');
    const pClass = pVal > 0 ? 'positive-val' : (pVal < 0 ? 'negative-val' : '');
    const cTip = isCartao ? ' title="Fatura atual (gastos do ciclo que vence neste mês)"' : '';
    const pTip = isCartao ? ' title="Saldo devedor total do cartão (compras − pagamentos)"' : '';
    const moedaTag = (!isCartao && c.moeda)
      ? ' <span class="moeda-tag">' + escapeHtml(c.moeda) + '</span>' : '';
    const item = document.createElement('div');
    item.className = 'mov-conta-item';
    item.innerHTML =
      '<input type="checkbox" data-id="' + escapeHtml(c.id) + '" data-kind="' + it.kind + '"' + (sel ? ' checked' : '') + '>' +
      '<div class="conta-name" title="' + escapeHtml(c.nome) + '">' +
        contaIconHtml(c, 16) + '<span>' + escapeHtml(c.nome) + '</span>' + moedaTag +
      '</div>' +
      '<div class="right ' + cClass + '"' + cTip + '>' + fmtBRL(cVal) + '</div>' +
      '<div class="right ' + pClass + '"' + pTip + '>' + fmtBRL(pVal) + '</div>';
    container.appendChild(item);
  }

  function renderGrupo_(container, itens) {
    container.innerHTML = '';
    let curTipo = null;
    itens.forEach(it => {
      if (it.tipo !== curTipo) {
        curTipo = it.tipo;
        const header = document.createElement('div');
        header.className = 'mov-conta-group';
        header.textContent = CONTA_TIPO_LABEL[it.tipo] || it.tipo;
        container.appendChild(header);
      }
      renderItem_(container, it);
    });
  }
  renderGrupo_(contOp,  itensOp);
  if (contPas) renderGrupo_(contPas, itensPassivos);

  // Totais operacional (caixa)
  function setTot_(id, v) {
    const el = $('#' + id);
    if (!el) return;
    el.textContent = fmtBRL(v);
    el.classList.remove('positive-val', 'negative-val');
    if (v > 0) el.classList.add('positive-val');
    else if (v < 0) el.classList.add('negative-val');
  }
  setTot_('mov-conta-total-conf', Number(view.totais.confirmado) || 0);
  setTot_('mov-conta-total-proj', Number(view.totais.projetado)  || 0);

  // Card de passivos: mostra só se houver passivos
  const pas = view.totais_passivos || { confirmado: 0, projetado: 0 };
  const passivosCard = $('#mov-passivos-card');
  if (passivosCard) {
    passivosCard.classList.toggle('hidden', itensPassivos.length === 0);
    if (itensPassivos.length > 0) {
      setTot_('mov-passivos-total-conf', Number(pas.confirmado) || 0);
      setTot_('mov-passivos-total-proj', Number(pas.projetado)  || 0);
    }
  }

  // Checkboxes "todos" sincronizados por grupo
  function _allSelected_(itens) {
    if (itens.length === 0) return false;
    return itens.every(it => {
      const set = it.kind === 'cartao' ? _movFiltro.cartoes : _movFiltro.contas;
      return set.has(it.data.id);
    });
  }
  $('#mov-conta-all').checked = _allSelected_(itensOp);
  const allPas = $('#mov-passivos-all');
  if (allPas) allPas.checked = _allSelected_(itensPassivos);
  // Disponibiliza pros handlers de click
  renderContaSidebar_._itensOp       = itensOp;
  renderContaSidebar_._itensPassivos = itensPassivos;

  const onClickItem = (e) => {
    const cb = e.target.closest('input[type="checkbox"]');
    const row = e.target.closest('.mov-conta-item');
    if (!cb && !row) return;
    let cbReal = cb;
    if (!cbReal && row) {
      cbReal = row.querySelector('input[type="checkbox"]');
      cbReal.checked = !cbReal.checked;
    }
    const id = cbReal.dataset.id;
    const kind = cbReal.dataset.kind;
    const set = (kind === 'cartao') ? _movFiltro.cartoes : _movFiltro.contas;
    if (cbReal.checked) set.add(id);
    else set.delete(id);
    reloadLancamentos();
  };
  contOp.onclick = onClickItem;
  if (contPas) contPas.onclick = onClickItem;
}

function renderOrcamentosSidebar_(orcamentos) {
  const card = $('#mov-orcamentos-card');
  const list = $('#mov-orcamentos-list');
  if (!card || !list) return;
  if (!orcamentos || orcamentos.length === 0) {
    card.classList.add('hidden');
    list.innerHTML = '';
    return;
  }
  card.classList.remove('hidden');
  list.innerHTML = orcamentos.map(o => {
    const pct = Math.min(100, Number(o.percentual) || 0);
    const subs = o.inclui_subs ? ' <span class="orc-sum-subs" title="Inclui subcategorias">+ subs</span>' : '';
    const virtTag = o.mostrar_restante ? ' <span class="orc-sum-subs" title="Mostra restante como lançamento virtual">restante</span>' : '';

    // Barra empilhada por status: cada segmento tem largura = (valor_status / orcado) * 100
    const orcado = Math.max(1, Number(o.orcado) || 1);
    const bs = o.consumido_por_status || { pendente: 0, agendado: 0, confirmado: 0, conciliado: 0 };
    const segs = ['conciliado','confirmado','agendado','pendente']
      .filter(st => (bs[st] || 0) > 0)
      .map(st => {
        const v = bs[st];
        const w = Math.min(100, (v / orcado) * 100);
        return '<div class="seg seg-' + st + '" style="width:' + w.toFixed(2) + '%" ' +
          'title="' + st + ': ' + fmtBRL(v) + '"></div>';
      }).join('');

    return '<div class="orc-summary-item">' +
      '<div class="orc-sum-header">' +
        '<span class="orc-sum-name">' + escapeHtml(o.nome || o.ref_nome || '—') + subs + virtTag + '</span>' +
        '<span class="orc-sum-pct">' + o.percentual + '%</span>' +
      '</div>' +
      '<div class="progress-bar mini stacked">' + segs + '</div>' +
      '<div class="orc-sum-foot ' + (o.restante < 0 ? 'negative-val' : 'muted') + '">' +
        fmtBRL(o.consumido) + ' / ' + fmtBRL(o.orcado) +
      '</div>' +
    '</div>';
  }).join('');
}

function renderResumo_(r) {
  const setColored = (id, value, displayValue) => {
    const el = $('#' + id);
    if (!el) return;
    el.textContent = (displayValue !== undefined) ? displayValue : fmtBRL(value);
    el.classList.remove('positive-val', 'negative-val');
    if (value > 0) el.classList.add('positive-val');
    else if (value < 0) el.classList.add('negative-val');
  };
  setColored('resumo-entradas',   r.entradas);
  setColored('resumo-receitas',   r.receitas);
  setColored('resumo-transf-in',  r.transf_in);
  // Saídas exibidas com sinal negativo (visualmente):
  setColored('resumo-saidas',    -r.saidas,    r.saidas    ? '-' + fmtBRL(r.saidas).replace('-', '')    : fmtBRL(0));
  setColored('resumo-despesas',  -r.despesas,  r.despesas  ? '-' + fmtBRL(r.despesas).replace('-', '')  : fmtBRL(0));
  setColored('resumo-transf-out',-r.transf_out, r.transf_out ? '-' + fmtBRL(r.transf_out).replace('-', '') : fmtBRL(0));
  setColored('resumo-resultado',  r.resultado);

  // Bloco de virtuais — só aparece se houver alguma previsão
  const virt = Number(r.virtuais) || 0;
  const rowV   = $('#resumo-row-virtuais');
  const rowCV  = $('#resumo-row-com-virtuais');
  if (rowV && rowCV) {
    if (virt > 0) {
      rowV.classList.remove('hidden');
      rowCV.classList.remove('hidden');
      const elV = $('#resumo-virtuais');
      if (elV) elV.textContent = '-' + fmtBRL(virt).replace('-', '');
      const comV = (r.resultado_com_virtuais !== undefined) ? r.resultado_com_virtuais : (r.resultado - virt);
      setColored('resumo-com-virtuais', comV);
    } else {
      rowV.classList.add('hidden');
      rowCV.classList.add('hidden');
    }
  }
}

function exportLancamentosVisiveis_() {
  const lancs = State._lancsVisiveis || [];
  if (lancs.length === 0) return toast('Nada para exportar.', true);
  const rows = lancs.map(l => ({
    data: l.data, descricao: l.descricao, valor: l.valor,
    conta: nameOf(State.cache.contas, l.conta, ''),
    cartao: nameOf(State.cache.cartoes, l.cartao, ''),
    categoria: nameOf(State.cache.categorias, l.categoria, ''),
    centro: nameOf(State.cache.centros, l.centro, ''),
    status: l.status,
    parcela: (l.parcela_atual && l.parcela_total) ? l.parcela_atual + '/' + l.parcela_total : '',
    observacao: l.observacao || ''
  }));
  const headers = [
    { key:'data', label:'Data' }, { key:'descricao', label:'Descrição' }, { key:'valor', label:'Valor' },
    { key:'conta', label:'Conta' }, { key:'cartao', label:'Cartão' },
    { key:'categoria', label:'Categoria' }, { key:'centro', label:'Centro' },
    { key:'status', label:'Status' }, { key:'parcela', label:'Parcela' },
    { key:'observacao', label:'Observação' }
  ];
  const sufixo = String(State.ano) + '-' + String(State.mes).padStart(2, '0');
  downloadCSV_('flowfinance-lancamentos-' + sufixo + '.csv', headers, rows);
}

// ===== Colapso de grupos de conta na tabela de Movimentações =====
let _gruposColapsados = null; // Set de keys (contaId) carregado do localStorage

function _carregaGruposColapsados_() {
  if (_gruposColapsados) return _gruposColapsados;
  try {
    const raw = localStorage.getItem('mov-grupos-colapsados');
    _gruposColapsados = new Set(raw ? JSON.parse(raw) : []);
  } catch (e) { _gruposColapsados = new Set(); }
  return _gruposColapsados;
}
function _salvaGruposColapsados_() {
  try { localStorage.setItem('mov-grupos-colapsados', JSON.stringify(Array.from(_gruposColapsados))); }
  catch (e) {}
}
function _grupoEstaColapsado_(key) { return _carregaGruposColapsados_().has(String(key)); }

/** Aplica visualmente o estado de colapso de um grupo (mostra/esconde linhas + chevron). */
function _aplicarColapsoGrupo_(body, key, colapsado) {
  const header = body.querySelector('.row-grupo-conta[data-grp-header="' + cssEscape_(key) + '"]');
  if (header) header.classList.toggle('collapsed', colapsado);
  body.querySelectorAll('tr[data-grp="' + cssEscape_(key) + '"]').forEach(tr => {
    tr.classList.toggle('hidden', colapsado);
  });
}
function cssEscape_(s) { return String(s).replace(/["\\]/g, '\\$&'); }

/** Resumo (chips coloridos) por status + virtuais de um grupo. */
function _grupoResumoHtml_(lancsGrupo) {
  const c = { conciliado: 0, confirmado: 0, agendado: 0, pendente: 0 };
  let virtuais = 0;
  lancsGrupo.forEach(l => {
    if (l._virtual) { virtuais++; return; }
    const s = l.status || 'pendente';
    if (c[s] !== undefined) c[s]++;
  });
  const reais = lancsGrupo.length - virtuais;
  const chip = (n, cls, label) => n > 0
    ? '<span class="grp-chip" title="' + label + ': ' + n + '"><span class="lanc-status-dot" style="background:' + statusColor_(cls) + '"></span>' + n + '</span>'
    : '';
  let html = '<span class="grupo-resumo">';
  html += '<span class="grp-total">' + reais + ' lanç.</span>';
  html += chip(c.conciliado, 'conciliado', 'Conciliados');
  html += chip(c.confirmado, 'confirmado', 'Confirmados');
  html += chip(c.agendado,   'agendado',   'Agendados');
  html += chip(c.pendente,   'pendente',   'Pendentes');
  if (virtuais > 0) {
    html += '<span class="grp-chip" title="Virtuais: ' + virtuais + '"><span class="material-icons-outlined" style="font-size:11px;color:var(--info)">calculate</span>' + virtuais + '</span>';
  }
  html += '</span>';
  return html;
}

function renderLancamentos(view) {
  const body = $('#lancamentos-body');
  if (!body) return;
  body.innerHTML = '';
  // Só lançamentos de CONTA (caixa) + virtuais — cartões vão na outra tabela
  const lancs = view.lancamentos_contas || view.lancamentos || [];
  const saldoAnt = (view.saldo_anterior_contas !== undefined)
    ? view.saldo_anterior_contas : view.saldo_anterior;
  const empty = $('#lancamentos-empty');
  if (empty) empty.classList.toggle('hidden', lancs.length > 0);

  // Seleção local: começa VAZIA (serve pra ação em massa, não pra filtrar resumo).
  State._lancResumoBase = view.resumo;
  State._lancSelecionados = new Set();

  // Linha de saldo anterior (data = último dia do mês anterior)
  const diaAnt = new Date(State.ano, State.mes - 1, 0);
  const trAnt = document.createElement('tr');
  trAnt.className = 'row-anterior';
  trAnt.innerHTML =
    '<td class="cell-check"><input type="checkbox" id="lanc-check-all" title="Marcar/desmarcar tudo"></td>' +
    '<td class="cell-status"></td>' +
    '<td class="cell-date">' + fmtDateBR_(Utils_formatDate_(diaAnt)) + '</td>' +
    '<td class="cell-desc">Saldo anterior</td>' +
    '<td class="cell-valor"></td>' +
    '<td class="cell-saldo ' + (saldoAnt < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(saldoAnt) + '</td>' +
    '<td class="cell-actions"></td>';
  body.appendChild(trAnt);

  // Agrupa lançamentos por conta — cada grupo tem header + saldo corrente próprio
  const grupos = new Map(); // contaId | '__outros__' → array de lancs
  lancs.forEach(l => {
    const key = l.conta ? String(l.conta) : '__outros__';
    if (!grupos.has(key)) grupos.set(key, []);
    grupos.get(key).push(l);
  });
  // Ordem: contas operacionais cadastradas (ordem do State.cache.contas), depois "outros"
  const allContas = State.cache.contas || [];
  const ordemGrupos = allContas
    .filter(c => c.tipo !== 'emprestimo' && grupos.has(c.id))
    .map(c => c.id);
  if (grupos.has('__outros__')) ordemGrupos.push('__outros__');
  // Cobre lançamentos em contas que não estão no cache atual (defensivo)
  Array.from(grupos.keys()).forEach(k => {
    if (k !== '__outros__' && ordemGrupos.indexOf(k) === -1) ordemGrupos.push(k);
  });

  ordemGrupos.forEach((contaId, gIdx) => {
    const lancsGrupo = grupos.get(contaId);
    if (!lancsGrupo || lancsGrupo.length === 0) return;
    const eOutros = contaId === '__outros__';
    const conta = eOutros ? null : allContas.find(c => String(c.id) === String(contaId));
    const nomeGrupo = conta ? conta.nome : 'Outros (virtuais)';
    const iconeGrupo = conta
      ? contaIconHtml(conta, 16)
      : '<span class="material-icons-outlined" style="font-size:16px;color:var(--info)">calculate</span>';
    const saldoAntGrupo = (conta && view.saldo_anterior_por_conta)
      ? Number(view.saldo_anterior_por_conta[contaId]) || 0
      : 0;

    // Saldo corrente dentro do grupo (precisa vir ANTES do header pra exibir no resumo colapsado)
    let saldoGrupo = saldoAntGrupo;
    lancsGrupo.forEach(l => {
      saldoGrupo += Number(l.valor) || 0;
      l._saldo_corrente_grupo = saldoGrupo;
    });

    const colapsado = _grupoEstaColapsado_(contaId);
    const resumoHtml = _grupoResumoHtml_(lancsGrupo);

    // Header do grupo (com chevron de colapso)
    const trGrupo = document.createElement('tr');
    trGrupo.className = 'row-grupo-conta' + (colapsado ? ' collapsed' : '');
    trGrupo.setAttribute('data-grp-header', contaId);
    trGrupo.innerHTML =
      '<td class="cell-check">' +
        '<button type="button" class="grp-toggle" data-grp-toggle="' + escapeHtml(contaId) + '" title="Recolher/expandir">' +
          '<span class="material-icons-outlined">expand_more</span>' +
        '</button>' +
      '</td>' +
      '<td colspan="3" class="cell-grupo-nome">' +
        '<span class="grupo-titulo">' + iconeGrupo + '<strong>' + escapeHtml(nomeGrupo) + '</strong></span>' +
        (conta ? '<span class="muted grupo-saldo-anterior">saldo anterior: ' + fmtBRL(saldoAntGrupo) + '</span>' : '') +
        resumoHtml +
      '</td>' +
      '<td class="cell-valor"></td>' +
      '<td class="cell-saldo grupo-saldo-resumo">' +
        (conta ? '<span class="muted">' + fmtBRL(saldoAntGrupo) + ' → </span><strong class="' + (saldoGrupo < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(saldoGrupo) + '</strong>' : '') +
      '</td>' +
      '<td class="cell-actions"></td>';
    body.appendChild(trGrupo);

  lancsGrupo.forEach(l => {
    const valor = Number(l.valor) || 0;
    const status = l.status || 'pendente';
    const saldoCorr = Number(l._saldo_corrente_grupo) || 0;
    const isVirtual = !!l._virtual;
    const transfIcon = l.transferencia_id
      ? '<span class="material-icons-outlined transfer-icon" title="Transferência/pagamento">swap_horiz</span>' : '';
    const virtualIcon = isVirtual
      ? '<span class="material-icons-outlined" title="Lançamento virtual — restante de orçamento" style="font-size:14px;color:var(--info);vertical-align:middle">calculate</span> ' : '';
    const anexoIcon = l.anexo_url
      ? ' <a href="' + escapeHtml(l.anexo_url) + '" target="_blank" rel="noopener" class="anexo-link" title="Comprovante"><span class="material-icons-outlined" style="font-size:14px">attach_file</span></a>' : '';
    const importIcon = (l.origem === 'importacao')
      ? '<span class="material-icons-outlined import-icon" title="Importado de extrato/fatura">file_download</span>' : '';

    // Ícones de série: parcelada vs. fixa
    const isParcela = !!(l.parcela_atual && l.parcela_total);
    const isFixa    = !!(l.recorrencia_id && !isParcela);
    const parcelaIcon = isParcela
      ? '<span class="material-icons-outlined serie-icon serie-parcela" title="Parcela ' + l.parcela_atual + '/' + l.parcela_total + '">format_list_numbered</span>' : '';
    const fixaIcon = isFixa
      ? '<span class="material-icons-outlined serie-icon serie-fixa" title="Lançamento fixo (recorrência)">event_repeat</span>' : '';

    // Tags: conta, categoria, centro (renomeei pra não colidir com `conta` do grupo)
    const contaTag_ = (State.cache.contas || []).find(c => String(c.id) === String(l.conta));
    const contaTag = contaTag_
      ? '<span class="tag tag-conta">' + contaIconHtml(contaTag_, 12) + escapeHtml(contaTag_.nome) + '</span>'
      : '';
    const catNome = nameOf(State.cache.categorias, l.categoria, '');
    const categoriaTag = catNome
      ? '<span class="tag tag-categoria">' + escapeHtml(catNome) + '</span>'
      : '';
    const centroNome = nameOf(State.cache.centros, l.centro, '');
    const centroTag = centroNome
      ? '<span class="tag tag-centro">' + escapeHtml(centroNome) + '</span>'
      : '';
    const cartao = (State.cache.cartoes || []).find(c => String(c.id) === String(l.cartao));
    const cartaoTag = cartao
      ? '<span class="tag tag-conta"><span class="material-icons-outlined">credit_card</span>' + escapeHtml(cartao.nome) + '</span>'
      : '';
    const virtualTag = isVirtual
      ? '<span class="tag tag-virtual">virtual</span>' : '';

    // Virtual de fatura ganha botão "Pagar"; outros virtuais ficam sem ação
    let actionsCell;
    if (isVirtual && l._fatura_cartao_id) {
      actionsCell = '<td class="cell-actions">' +
        '<button class="btn-pagar-fatura" data-act="pagar-fatura"' +
        ' data-cartao-id="' + escapeHtml(l._fatura_cartao_id) + '"' +
        ' data-valor="' + Math.abs(Number(l.valor) || 0) + '"' +
        ' data-data="' + escapeHtml(l.data || '') + '"' +
        ' title="Pagar fatura">' +
          '<span class="material-icons-outlined">payments</span> Pagar' +
        '</button>' +
      '</td>';
    } else if (isVirtual) {
      actionsCell = '<td class="cell-actions"></td>';
    } else {
      actionsCell = '<td class="cell-actions">' +
          '<div class="row-actions">' +
            '<button class="icon-btn" data-act="edit"  data-id="' + escapeHtml(l.id) + '" title="Editar"><span class="material-icons-outlined">edit</span></button>' +
            '<button class="icon-btn" data-act="clone" data-id="' + escapeHtml(l.id) + '" title="Clonar (criar novo com mesmos campos)"><span class="material-icons-outlined">content_copy</span></button>' +
            '<button class="icon-btn" data-act="del"   data-id="' + escapeHtml(l.id) + '" title="Excluir"><span class="material-icons-outlined">delete</span></button>' +
          '</div>' +
        '</td>';
    }

    const tr = document.createElement('tr');
    const trClasses = ['lanc-row-' + status];
    if (isVirtual) trClasses.push('row-virtual');
    if (colapsado) trClasses.push('hidden');
    tr.className = trClasses.join(' ');
    tr.setAttribute('data-grp', contaId);
    tr.innerHTML =
      '<td class="cell-check"><input type="checkbox" class="lanc-check" data-lanc-id="' + escapeHtml(l.id) + '"></td>' +
      '<td class="cell-status">' + statusIconHtml_(status, isVirtual) + '</td>' +
      '<td class="cell-date">' + fmtDateBR_(l.data) + '</td>' +
      '<td class="cell-desc">' +
        '<div class="lanc-desc-line">' + virtualIcon + transfIcon + parcelaIcon + fixaIcon + importIcon + escapeHtml(l.descricao) + anexoIcon + '</div>' +
        '<div class="lanc-tags">' + contaTag + cartaoTag + categoriaTag + centroTag + virtualTag + '</div>' +
      '</td>' +
      '<td class="cell-valor ' + (valor < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(valor) + '</td>' +
      '<td class="cell-saldo ' + (saldoCorr < 0 ? 'negative-val' : '') + '">' + fmtBRL(saldoCorr) + '</td>' +
      actionsCell;
    body.appendChild(tr);
  });

    // Subtotal de saldo do grupo (só para contas reais, não pro "Outros")
    if (conta) {
      const trSubtotal = document.createElement('tr');
      trSubtotal.className = 'row-grupo-subtotal' + (colapsado ? ' hidden' : '');
      trSubtotal.setAttribute('data-grp', contaId);
      trSubtotal.innerHTML =
        '<td class="cell-check"></td>' +
        '<td class="cell-status"></td>' +
        '<td class="cell-date"></td>' +
        '<td class="cell-desc"><span class="muted">saldo final ' + escapeHtml(nomeGrupo) + '</span></td>' +
        '<td class="cell-valor"></td>' +
        '<td class="cell-saldo ' + (saldoGrupo < 0 ? 'negative-val' : 'positive-val') + '"><strong>' + fmtBRL(saldoGrupo) + '</strong></td>' +
        '<td class="cell-actions"></td>';
      body.appendChild(trSubtotal);
    }
  });

  // Linha de fechamento: saldo final do caixa (real e com previsão)
  if (lancs.length > 0) {
    const saldoReal = (view.saldo_final_contas !== undefined)
      ? Number(view.saldo_final_contas) : saldoAnt;
    const saldoComV = (view.saldo_final_contas_com_virtuais !== undefined)
      ? Number(view.saldo_final_contas_com_virtuais) : saldoReal;
    const temVirtuais = Math.abs(saldoComV - saldoReal) > 0.001;

    const trFinalReal = document.createElement('tr');
    trFinalReal.className = 'row-final';
    trFinalReal.innerHTML =
      '<td class="cell-check"></td>' +
      '<td class="cell-status"></td>' +
      '<td class="cell-date"></td>' +
      '<td class="cell-desc"><strong>Saldo final do mês</strong>' +
        (temVirtuais ? ' <span class="muted" style="font-size:11px">(sem previsão de orçamentos)</span>' : '') +
      '</td>' +
      '<td class="cell-valor"></td>' +
      '<td class="cell-saldo ' + (saldoReal < 0 ? 'negative-val' : 'positive-val') + '"><strong>' + fmtBRL(saldoReal) + '</strong></td>' +
      '<td class="cell-actions"></td>';
    body.appendChild(trFinalReal);

    if (temVirtuais) {
      const trFinalV = document.createElement('tr');
      trFinalV.className = 'row-final row-final-virtual';
      trFinalV.innerHTML =
        '<td class="cell-check"></td>' +
        '<td class="cell-status"></td>' +
        '<td class="cell-date"></td>' +
        '<td class="cell-desc"><strong>Saldo com previsão de orçamentos</strong></td>' +
        '<td class="cell-valor"></td>' +
        '<td class="cell-saldo ' + (saldoComV < 0 ? 'negative-val' : '') + '"><strong>' + fmtBRL(saldoComV) + '</strong></td>' +
        '<td class="cell-actions"></td>';
      body.appendChild(trFinalV);
    }
  }

  // Handlers dos checkboxes — seleção serve pra AÇÃO EM MASSA (não filtra o resumo).
  // Considera só lançamentos reais (não virtuais) como selecionáveis.
  const selecionaveis = lancs.filter(l => !l._virtual);
  const checkAll = $('#lanc-check-all');
  if (checkAll) {
    checkAll.onchange = () => {
      const checked = checkAll.checked;
      State._lancSelecionados = checked
        ? new Set(selecionaveis.map(l => String(l.id)))
        : new Set();
      $$('.lanc-check', body).forEach(cb => {
        cb.checked = checked;
        const tr = cb.closest('tr'); if (tr) tr.classList.toggle('lanc-row-selecionada', checked);
      });
      _updateContasBulkBar_();
    };
  }
  $$('.lanc-check', body).forEach(cb => {
    cb.onchange = () => {
      const id = String(cb.dataset.lancId);
      if (cb.checked) State._lancSelecionados.add(id);
      else State._lancSelecionados.delete(id);
      const tr = cb.closest('tr'); if (tr) tr.classList.toggle('lanc-row-selecionada', cb.checked);
      const sel = State._lancSelecionados.size;
      if (checkAll) {
        checkAll.checked = (sel === selecionaveis.length && sel > 0);
        checkAll.indeterminate = (sel > 0 && sel < selecionaveis.length);
      }
      _updateContasBulkBar_();
    };
  });
  _setupContasBulkBar_();
  _updateContasBulkBar_();

  body.onclick = async (e) => {
    // Chevron de colapso de grupo (ou click no header do grupo) → recolhe/expande
    const tog = e.target.closest('[data-grp-toggle]');
    const headerRow = e.target.closest('.row-grupo-conta');
    if (tog || (headerRow && !e.target.closest('button'))) {
      const key = tog ? tog.dataset.grpToggle : headerRow.getAttribute('data-grp-header');
      if (key) {
        const set = _carregaGruposColapsados_();
        const novoColapsado = !set.has(String(key));
        if (novoColapsado) set.add(String(key)); else set.delete(String(key));
        _salvaGruposColapsados_();
        _aplicarColapsoGrupo_(body, key, novoColapsado);
      }
      return;
    }
    // Click na descrição (fora dos botões) abre edição
    const descCell = e.target.closest('.cell-desc');
    if (descCell && !e.target.closest('button')) {
      const tr = descCell.closest('tr');
      const cb = tr && tr.querySelector('.lanc-check');
      const id = cb && cb.dataset.lancId;
      const lanc = id && lancs.find(l => String(l.id) === String(id));
      if (lanc && !lanc._virtual) {
        if (lanc.transferencia_id) {
          toast('Transferências não são editáveis diretamente. Exclua (remove as 2 pernas) e crie de novo.', true);
        } else {
          openLancamentoModal(lanc);
        }
        return;
      }
    }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'pagar-fatura') {
      openPagarFaturaModal_({
        cartaoId: btn.dataset.cartaoId,
        valor: Number(btn.dataset.valor) || 0,
        data:  btn.dataset.data
      });
      return;
    }
    const id = btn.dataset.id;
    const lanc = lancs.find(l => String(l.id) === String(id));
    if (btn.dataset.act === 'edit') {
      if (lanc && lanc.transferencia_id) {
        toast('Transferências não são editáveis diretamente. Exclua (remove as 2 pernas) e crie de novo.', true);
        return;
      }
      openLancamentoModal(lanc);
    } else if (btn.dataset.act === 'clone') {
      if (lanc && lanc.transferencia_id) {
        toast('Use o botão de nova transferência para criar outra.', true);
        return;
      }
      openLancamentoModal(lanc, null, 'clone');
    } else if (btn.dataset.act === 'del') {
      try {
        // Lançamento de série: pergunta o escopo via modal
        if (lanc && lanc.recorrencia_id) {
          const scope = await askSerieScope_('Excluir', id);
          if (!scope) return; // cancelou
          showLoader(true);
          const r = await run('deleteLancamentoSerie', id, scope);
          toast(r.count + ' lançamento' + (r.count === 1 ? '' : 's') + ' excluído' + (r.count === 1 ? '' : 's') + '.');
        } else {
          const msg = (lanc && lanc.transferencia_id)
            ? 'Excluir esta transferência? As duas pernas (saída e entrada) serão removidas.'
            : 'Excluir este lançamento?';
          if (!confirm(msg)) return;
          showLoader(true);
          await run('deleteLancamento', id);
          toast(lanc && lanc.transferencia_id ? 'Transferência excluída.' : 'Excluído');
        }
        await reloadLancamentos();
      } catch (err) {
        toast(err.message, true);
      } finally {
        showLoader(false);
      }
    }
  };
}

// ===== Barra de ação em massa da tabela de Contas =====
let _bulkCombo = null; // combobox de categoria do modal bulk

function _updateContasBulkBar_() {
  const bar = $('#contas-bulk-bar');
  if (!bar) return;
  const n = (State._lancSelecionados || new Set()).size;
  bar.classList.toggle('hidden', n === 0);
  const cnt = $('#contas-bulk-count');
  if (cnt) cnt.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  if (n > 0) _bulkCtxMov_(); // fixa o contexto da ação em massa pra Movimentações
}

function _setupContasBulkBar_() {
  // Botões da barra estão DENTRO do template (re-clonados a cada navegação) —
  // usam .onclick/.onchange (idempotente), então religamos sempre.
  const statusSel = $('#contas-bulk-status');
  if (statusSel) statusSel.onchange = async () => {
    const novoStatus = statusSel.value;
    statusSel.value = '';
    if (!novoStatus) return;
    await _aplicarBulk_({ status: novoStatus }, 'Status alterado');
  };
  const btnCat = $('#contas-bulk-categoria');
  if (btnCat) btnCat.onclick = () => openBulkModal_('categoria');
  const btnConta = $('#contas-bulk-conta');
  if (btnConta) btnConta.onclick = () => openBulkModal_('conta');
  const btnDel = $('#contas-bulk-del');
  if (btnDel) btnDel.onclick = async () => {
    const ids = Array.from(State._lancSelecionados || []);
    if (ids.length === 0) return;
    if (!confirm('Excluir ' + ids.length + ' lançamento(s) selecionado(s)? Não pode ser desfeito.')) return;
    showLoader(true);
    try {
      const r = await run('deleteLancamentosBatch', ids);
      toast(r.count + ' lançamento(s) excluído(s).');
      State._lancSelecionados = new Set();
      await reloadLancamentos();
    } catch (e) { toast(e.message, true); }
    finally { showLoader(false); }
  };
  const btnClear = $('#contas-bulk-clear');
  if (btnClear) btnClear.onclick = () => {
    State._lancSelecionados = new Set();
    $$('#lancamentos-body .lanc-check').forEach(cb => { cb.checked = false; });
    $$('#lancamentos-body tr.lanc-row-selecionada').forEach(tr => tr.classList.remove('lanc-row-selecionada'));
    const ca = $('#lanc-check-all'); if (ca) { ca.checked = false; ca.indeterminate = false; }
    _updateContasBulkBar_();
  };

  _setupBulkModalOnce_();
}

/** Inicializa o modal de edição em massa (global). Idempotente — só liga listeners uma vez. */
function _setupBulkModalOnce_() {
  if (_setupBulkModalOnce_._done) return;
  _setupBulkModalOnce_._done = true;
  _bulkCombo = setupCombobox_('bulk-categoria', () => getCategoriaOptionsTodas_());
  $('#bulk-modal-close').onclick  = () => $('#bulk-modal').classList.add('hidden');
  $('#bulk-modal-cancel').onclick = () => $('#bulk-modal').classList.add('hidden');
  $('#bulk-modal-bg').onclick     = () => $('#bulk-modal').classList.add('hidden');
  $('#bulk-modal-ok').onclick     = _confirmarBulkModal_;
}

/** Todas as categorias (receita+despesa) com hierarquia — pro modal de massa. */
function getCategoriaOptionsTodas_() {
  const all = (State.cache.categorias || []).filter(c => c.tipo !== 'transferencia');
  const byName = (a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
  const pais = all.filter(c => !c.pai).sort(byName);
  const filhosPorPai = {};
  all.filter(c => c.pai).forEach(c => { (filhosPorPai[c.pai] = filhosPorPai[c.pai] || []).push(c); });
  const opts = [];
  pais.forEach(p => {
    opts.push({ value: p.id, label: p.nome, indent: false, searchText: p.nome });
    (filhosPorPai[p.id] || []).sort(byName).forEach(f =>
      opts.push({ value: f.id, label: f.nome, indent: true, searchText: p.nome + ' ' + f.nome }));
  });
  return opts;
}

// Contexto da ação em massa: define DE ONDE vêm os ids selecionados e o que recarregar.
// Fixado pelos handlers de checkbox de cada tela (Movimentações vs aba Cartões).
let _bulkCtx = null;
function _bulkCtxMov_() {
  _bulkCtx = {
    getIds: () => Array.from(State._lancSelecionados || []),
    clear:  () => { State._lancSelecionados = new Set(); },
    reload: () => reloadLancamentos()
  };
}
function _bulkCtxFatura_() {
  _bulkCtx = {
    getIds: () => Array.from(State._faturaSelecionados || []),
    clear:  () => { State._faturaSelecionados = new Set(); },
    reload: () => renderFatura()
  };
}
// Default: Movimentações (sobrescrito ao selecionar em outra tela)
_bulkCtxMov_();

async function _aplicarBulk_(changes, msgOk) {
  const ids = _bulkCtx.getIds();
  if (ids.length === 0) { toast('Selecione ao menos um lançamento.', true); return; }
  showLoader(true);
  try {
    const r = await run('updateLancamentosBatch', ids, changes);
    toast((msgOk || 'Atualizado') + ': ' + r.count + ' lançamento(s).');
    _bulkCtx.clear();
    await _bulkCtx.reload();
  } catch (e) { toast(e.message, true); }
  finally { showLoader(false); }
}

function openBulkModal_(modo) {
  const modal = $('#bulk-modal');
  if (!modal) return;
  const n = _bulkCtx.getIds().length;
  if (n === 0) { toast('Selecione ao menos um lançamento.', true); return; }

  const ehConta = modo === 'conta';
  $('#bulk-modal-title').textContent = ehConta ? 'Mover para outra conta' : 'Mudar categoria / centro';
  $('#bulk-modal-desc').textContent  = 'Aplicar a ' + n + ' lançamento(s) selecionado(s). Campos vazios não são alterados.';
  $('#bulk-row-categoria').style.display = ehConta ? 'none' : '';
  $('#bulk-row-centro').style.display    = ehConta ? 'none' : '';
  $('#bulk-row-conta').style.display     = ehConta ? '' : 'none';

  // Reset campos
  if (_bulkCombo) { _bulkCombo.refresh(); _bulkCombo.setValue(''); }
  fillSel_('#bulk-centro', State.cache.centros || [], true);
  $('#bulk-centro').value = '';
  // Conta: só operacionais
  const contasOp = (State.cache.contas || []).filter(c => c.tipo !== 'emprestimo');
  fillSel_('#bulk-conta', contasOp, true);
  $('#bulk-conta').value = '';

  modal.dataset.modo = modo;
  modal.classList.remove('hidden');
}

async function _confirmarBulkModal_() {
  const modal = $('#bulk-modal');
  const modo = modal.dataset.modo;
  const changes = {};
  if (modo === 'conta') {
    const c = $('#bulk-conta').value;
    if (!c) { toast('Selecione a conta de destino.', true); return; }
    changes.conta = c;
  } else {
    const cat = $('#bulk-categoria').value;
    const cen = $('#bulk-centro').value;
    if (!cat && !cen) { toast('Escolha categoria e/ou centro.', true); return; }
    if (cat) changes.categoria = cat;
    if (cen) changes.centro = cen;
  }
  modal.classList.add('hidden');
  await _aplicarBulk_(changes, 'Lançamentos atualizados');
}

function renderCartoesTable_(view) {
  const body = $('#cartoes-body');
  const empty = $('#cartoes-empty');
  const rodape = $('#cartoes-rodape');
  if (!body) return;
  body.innerHTML = '';
  if (rodape) rodape.innerHTML = '';

  const lancs = view.lancamentos_cartoes || [];
  if (empty) empty.classList.toggle('hidden', lancs.length > 0);
  State._cartaoSelecionados = new Set();

  // Agrupa lançamentos por cartão
  const gruposK = new Map(); // cartaoId → array de lancs
  lancs.forEach(l => {
    const key = l.cartao ? String(l.cartao) : '__sem_cartao__';
    if (!gruposK.has(key)) gruposK.set(key, []);
    gruposK.get(key).push(l);
  });
  const allCartoes = State.cache.cartoes || [];
  const ordemK = allCartoes.filter(c => gruposK.has(c.id)).map(c => c.id);
  Array.from(gruposK.keys()).forEach(k => {
    if (k !== '__sem_cartao__' && ordemK.indexOf(k) === -1) ordemK.push(k);
  });
  if (gruposK.has('__sem_cartao__')) ordemK.push('__sem_cartao__');

  ordemK.forEach(cartaoId => {
    const lancsK = gruposK.get(cartaoId);
    if (!lancsK || lancsK.length === 0) return;
    const cartaoObj = cartaoId === '__sem_cartao__' ? null : allCartoes.find(c => String(c.id) === String(cartaoId));
    const nomeK = cartaoObj ? cartaoObj.nome : 'Outros';
    const iconeK = cartaoObj
      ? contaIconHtml(Object.assign({tipo:'cartao'}, cartaoObj), 16)
      : '<span class="material-icons-outlined" style="font-size:16px">credit_card</span>';

    // Acumulado por grupo (fatura desse cartão) — calcula antes do header pro resumo
    let acumK = 0;
    lancsK.forEach(l => {
      acumK += Number(l.valor) || 0;
      l._fatura_acum_grupo = acumK;
    });

    const grpKey = 'k:' + cartaoId;
    const colapsadoK = _grupoEstaColapsado_(grpKey);
    const resumoK = _grupoResumoHtml_(lancsK);

    // Header do cartão (com chevron de colapso)
    const trK = document.createElement('tr');
    trK.className = 'row-grupo-conta' + (colapsadoK ? ' collapsed' : '');
    trK.setAttribute('data-grp-header', grpKey);
    trK.innerHTML =
      '<td class="cell-check">' +
        '<button type="button" class="grp-toggle" data-grp-toggle="' + escapeHtml(grpKey) + '" title="Recolher/expandir"><span class="material-icons-outlined">expand_more</span></button>' +
      '</td>' +
      '<td colspan="3" class="cell-grupo-nome">' +
        '<span class="grupo-titulo">' + iconeK + '<strong>' + escapeHtml(nomeK) + '</strong></span>' +
        resumoK +
      '</td>' +
      '<td class="cell-valor"></td>' +
      '<td class="cell-saldo grupo-saldo-resumo">' +
        (cartaoObj ? '<strong class="' + (acumK < 0 ? 'negative-val' : '') + '">' + fmtBRL(acumK) + '</strong>' : '') +
      '</td>' +
      '<td class="cell-actions"></td>';
    body.appendChild(trK);

    lancsK.forEach(l => {
      const valor = Number(l.valor) || 0;
      const status = l.status || 'pendente';
      const acumulado = Number(l._fatura_acum_grupo) || 0;
      const isParcela = !!(l.parcela_atual && l.parcela_total);
      const isFixa = !!(l.recorrencia_id && !isParcela);
      const parcelaIcon = isParcela
        ? '<span class="material-icons-outlined serie-icon serie-parcela" title="Parcela ' + l.parcela_atual + '/' + l.parcela_total + '">format_list_numbered</span>' : '';
      const fixaIcon = isFixa
        ? '<span class="material-icons-outlined serie-icon serie-fixa" title="Lançamento fixo">event_repeat</span>' : '';
      const importIcon = (l.origem === 'importacao')
        ? '<span class="material-icons-outlined import-icon" title="Importado de extrato/fatura">file_download</span>' : '';
      const catNome = nameOf(State.cache.categorias, l.categoria, '');
      const categoriaTag = catNome ? '<span class="tag tag-categoria">' + escapeHtml(catNome) + '</span>' : '';

      const tr = document.createElement('tr');
      tr.className = 'lanc-row-' + status + (colapsadoK ? ' hidden' : '');
      tr.setAttribute('data-grp', grpKey);
      tr.innerHTML =
        '<td class="cell-check"><input type="checkbox" class="cartao-check" data-id="' + escapeHtml(l.id) + '"></td>' +
        '<td class="cell-status">' + statusIconHtml_(status, false) + '</td>' +
        '<td class="cell-date">' + fmtDateBR_(l.data) + '</td>' +
        '<td class="cell-desc">' +
          '<div class="lanc-desc-line">' + parcelaIcon + fixaIcon + importIcon + escapeHtml(l.descricao) + '</div>' +
          '<div class="lanc-tags">' + categoriaTag + '</div>' +
        '</td>' +
        '<td class="cell-valor ' + (valor < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(valor) + '</td>' +
        '<td class="cell-saldo" title="Fatura acumulada do cartão">' + fmtBRL(acumulado) + '</td>' +
        '<td class="cell-actions">' +
          '<div class="row-actions">' +
            '<button class="icon-btn" data-act="edit"  data-id="' + escapeHtml(l.id) + '" title="Editar"><span class="material-icons-outlined">edit</span></button>' +
            '<button class="icon-btn" data-act="clone" data-id="' + escapeHtml(l.id) + '" title="Clonar"><span class="material-icons-outlined">content_copy</span></button>' +
            '<button class="icon-btn" data-act="del"   data-id="' + escapeHtml(l.id) + '" title="Excluir"><span class="material-icons-outlined">delete</span></button>' +
          '</div>' +
        '</td>';
      body.appendChild(tr);
    });

    // Subtotal do cartão
    if (cartaoObj) {
      const trSub = document.createElement('tr');
      trSub.className = 'row-grupo-subtotal' + (colapsadoK ? ' hidden' : '');
      trSub.setAttribute('data-grp', grpKey);
      trSub.innerHTML =
        '<td class="cell-check"></td>' +
        '<td class="cell-status"></td>' +
        '<td class="cell-date"></td>' +
        '<td class="cell-desc"><span class="muted">total ' + escapeHtml(nomeK) + '</span></td>' +
        '<td class="cell-valor"></td>' +
        '<td class="cell-saldo ' + (acumK < 0 ? 'negative-val' : '') + '"><strong>' + fmtBRL(acumK) + '</strong></td>' +
        '<td class="cell-actions"></td>';
      body.appendChild(trSub);
    }
  });

  // Seleção múltipla (checkboxes) + barra de ação em massa
  const bulkBar = $('#cartoes-bulk-bar');
  const bulkCount = $('#cartoes-bulk-count');
  const atualizaBulk = () => {
    const n = State._cartaoSelecionados.size;
    if (bulkBar) bulkBar.classList.toggle('hidden', n === 0);
    if (bulkCount) bulkCount.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  };
  $$('.cartao-check', body).forEach(cb => {
    cb.onchange = () => {
      const id = String(cb.dataset.id);
      if (cb.checked) State._cartaoSelecionados.add(id);
      else State._cartaoSelecionados.delete(id);
      cb.closest('tr').classList.toggle('row-selected', cb.checked);
      atualizaBulk();
    };
  });
  atualizaBulk();

  const bulkDel = $('#cartoes-bulk-del');
  if (bulkDel) {
    bulkDel.onclick = async () => {
      const ids = Array.from(State._cartaoSelecionados);
      if (ids.length === 0) return;
      if (!confirm('Excluir ' + ids.length + ' lançamento(s) selecionado(s) do cartão? Esta ação não pode ser desfeita.')) return;
      showLoader(true);
      try {
        const r = await run('deleteLancamentosBatch', ids);
        toast(r.count + ' lançamento(s) excluído(s).');
        State._cartaoSelecionados = new Set();
        await reloadLancamentos();
      } catch (err) {
        toast(err.message, true);
      } finally {
        showLoader(false);
      }
    };
  }

  body.onclick = async (e) => {
    // Chevron de colapso de grupo (ou click no header do cartão) → recolhe/expande
    const tog = e.target.closest('[data-grp-toggle]');
    const headerRow = e.target.closest('.row-grupo-conta');
    if (tog || (headerRow && !e.target.closest('button'))) {
      const key = tog ? tog.dataset.grpToggle : headerRow.getAttribute('data-grp-header');
      if (key) {
        const set = _carregaGruposColapsados_();
        const novo = !set.has(String(key));
        if (novo) set.add(String(key)); else set.delete(String(key));
        _salvaGruposColapsados_();
        _aplicarColapsoGrupo_(body, key, novo);
      }
      return;
    }
    // Click na descrição (fora de botões/checkbox) abre edição
    const descCell = e.target.closest('.cell-desc');
    if (descCell && !e.target.closest('button')) {
      const tr = descCell.closest('tr');
      const cb = tr && tr.querySelector('.cartao-check');
      const id = cb && cb.dataset.id;
      const lanc = id && lancs.find(l => String(l.id) === String(id));
      if (lanc) { openLancamentoModal(lanc); return; }
    }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const lanc = lancs.find(l => String(l.id) === String(id));
    if (btn.dataset.act === 'edit') {
      openLancamentoModal(lanc);
    } else if (btn.dataset.act === 'clone') {
      openLancamentoModal(lanc, null, 'clone');
    } else if (btn.dataset.act === 'del') {
      try {
        if (lanc && lanc.recorrencia_id) {
          const scope = await askSerieScope_('Excluir', id);
          if (!scope) return;
          showLoader(true);
          const r = await run('deleteLancamentoSerie', id, scope);
          toast(r.count + ' lançamento' + (r.count === 1 ? '' : 's') + ' excluído' + (r.count === 1 ? '' : 's') + '.');
        } else {
          if (!confirm('Excluir este lançamento do cartão?')) return;
          showLoader(true);
          await run('deleteLancamento', id);
          toast('Excluído');
        }
        await reloadLancamentos();
      } catch (err) {
        toast(err.message, true);
      } finally {
        showLoader(false);
      }
    }
  };

  // Rodapé: total do mês por cartão + vencimento + limite disponível
  const info = view.cartoes_info || [];
  if (rodape) {
    if (info.length === 0) {
      rodape.innerHTML = '';
    } else {
      info.forEach(c => {
        const div = document.createElement('div');
        div.className = 'cartao-rodape-item';
        const logo = contaIconHtml(Object.assign({tipo:'cartao'}, c), 16);
        const venc = c.vencimento
          ? 'vence ' + fmtDateBR_(c.vencimento)
          : (c.dia_vencimento ? 'vence dia ' + c.dia_vencimento : '');
        const disp = (c.disponivel !== null && c.disponivel !== undefined)
          ? 'disponível ' + fmtBRL(c.disponivel) + ' de ' + fmtBRL(c.limite) : '';
        const totalAbs = Math.abs(Number(c.total_mes) || 0);
        div.innerHTML =
          '<div class="cartao-rodape-nome">' + logo + escapeHtml(c.nome) + '</div>' +
          '<div class="cartao-rodape-total negative-val">-' + fmtBRL(totalAbs).replace('-', '') + '</div>' +
          '<div class="cartao-rodape-meta">' +
            (venc ? '<span><span class="material-icons-outlined" style="font-size:13px;vertical-align:middle">event</span> ' + venc + '</span>' : '') +
            (disp ? '<span><span class="material-icons-outlined" style="font-size:13px;vertical-align:middle">credit_score</span> ' + disp + '</span>' : '') +
          '</div>';
        rodape.appendChild(div);
      });
    }
  }
}

function statusColor_(status) {
  const map = { pendente: '#c0392b', agendado: '#6f8de8', confirmado: '#00a37c', conciliado: '#6a1b9a' };
  return map[status] || '#999';
}

/** Indicador visual de status na tabela: bolinha pra pendente/agendado, ícone pra confirmado/conciliado. */
function statusIconHtml_(status, isVirtual) {
  const title = escapeHtml(STATUS_HINTS[status] || status);
  const dim = isVirtual ? ' lanc-status-dim' : '';
  if (status === 'confirmado') {
    return '<span class="lanc-status-icon status-confirmado' + dim + '" title="' + title + '">' +
      '<span class="material-icons-outlined">check_circle</span></span>';
  }
  if (status === 'conciliado') {
    return '<span class="lanc-status-icon status-conciliado' + dim + '" title="' + title + '">' +
      '<span class="material-icons-outlined">verified</span></span>';
  }
  return '<span class="lanc-status-dot' + dim + '" style="background:' + statusColor_(status) + '" title="' + title + '"></span>';
}

function fmtDateBR_(s) {
  if (!s) return '';
  const str = String(s);
  if (str.length === 10 && str[4] === '-') {
    return str.slice(8, 10) + '/' + str.slice(5, 7) + '/' + str.slice(2, 4);
  }
  return fmtDate(s);
}

function Utils_formatDate_(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

// ============================================================================
// Modal de lançamento (custom: tipo selector + 2 colunas + salvar e novo)
// ============================================================================

const _lancModal = { tipo: 'despesa', editando: null, status: 'pendente', repeticao: 'unica', setupDone: false };

const STATUS_HINTS = {
  pendente:   'Previsto, ainda não realizou',
  agendado:   'Programado pelo banco (débito automático, agendamento)',
  confirmado: 'Já aconteceu — dinheiro entrou/saiu da conta',
  conciliado: 'Confirmado e batido com o extrato'
};

const STATUS_ICONS = {
  pendente:   'schedule',
  agendado:   'event',
  confirmado: 'check',
  conciliado: 'done_all'
};

function autoStatusForDate_(dateStr) {
  if (!dateStr) return 'pendente';
  return dateStr < todayISO() ? 'pendente' : 'agendado';
}

function effectiveLancStatus_() {
  // Se o usuário escolheu confirmado/conciliado, usa. Senão, deriva da data.
  if (_lancModal.status === 'confirmado' || _lancModal.status === 'conciliado') {
    return _lancModal.status;
  }
  const dt = $('#lf-data') ? $('#lf-data').value : '';
  return autoStatusForDate_(dt);
}

function setLancStatus_(value) {
  // null/'pendente'/'agendado' = auto (sem botão marcado)
  if (value !== 'confirmado' && value !== 'conciliado') value = null;
  _lancModal.status = value;
  $$('.status-btn').forEach(b => b.classList.toggle('active', b.dataset.status === value));
  const el = $('#lf-status-hint');
  if (el) {
    const eff = effectiveLancStatus_();
    const auto = !_lancModal.status ? ' (automático pela data)' : '';
    el.textContent = (STATUS_HINTS[eff] || '') + auto;
  }
}

function setLancRepeticao_(value) {
  _lancModal.repeticao = value || 'unica';
  $$('input[name="lf-rep"]').forEach(r => { r.checked = r.value === _lancModal.repeticao; });
  $('#rep-detail-parcelada').classList.toggle('hidden', _lancModal.repeticao !== 'parcelada');
  $('#rep-detail-fixa').classList.toggle('hidden', _lancModal.repeticao !== 'fixa');
}

const PERIOD_UNIT = { diaria: 'dias', semanal: 'semanas', mensal: 'meses', anual: 'anos' };

function updateRepIntervaloLabels_() {
  const parc = $('#lf-parc-period');
  const fix  = $('#lf-fix-period');
  if (parc) $('#lf-parc-intervalo-label').textContent = 'Repete-se a cada N ' + (PERIOD_UNIT[parc.value] || 'meses') + ' *';
  if (fix)  $('#lf-fix-intervalo-label').textContent  = 'Repete-se a cada N ' + (PERIOD_UNIT[fix.value]  || 'meses') + ' *';
}

function openTransferenciaModal() {
  openLancamentoModal(null, 'transferencia');
}

function openLancamentoModal(lanc, presetTipo, mode) {
  setupLancModalOnce_();

  // mode: 'edit' (default quando lanc tem id) | 'clone' | 'new'
  mode = mode || (lanc && lanc.id ? 'edit' : 'new');
  const isEdit  = mode === 'edit';
  const isClone = mode === 'clone';

  // Detecta tipo
  let tipo = presetTipo || 'despesa';
  if (lanc) {
    if (lanc.transferencia_id)             tipo = 'transferencia';
    else if (Number(lanc.valor) > 0)       tipo = 'receita';
    else                                   tipo = 'despesa';
  }
  // Só registra como "editando" no modo edit — clone vira novo lançamento
  _lancModal.editando = isEdit ? lanc : null;

  // Popula selects
  const contas     = State.cache.contas     || [];
  const cartoes    = State.cache.cartoes    || [];
  const categorias = State.cache.categorias || [];
  const centros    = State.cache.centros    || [];

  // Atualiza combobox unificado (contas + cartões)
  if (_lfOndeCombo) _lfOndeCombo.refresh();
  fillSel_('#lf-conta-origem',   contas,     false);
  fillSel_('#lf-conta-destino',  contas,     false);
  fillSel_('#lf-categoria',      categorias, true);
  fillSel_('#lf-centro',         centros,    true);

  // Reset
  setupMoneyInput_($('#lf-valor'));
  $('#lf-data').value       = todayISO();
  $('#lf-descricao').value  = '';
  const sugReset1 = $('#lf-regra-sugestao'); if (sugReset1) sugReset1.classList.add('hidden');
  setMoneyInputValue_($('#lf-valor'), 0); $('#lf-valor').value = '';
  if (_lfOndeCombo) _lfOndeCombo.setValue('');
  $('#lf-categoria').value  = '';
  $('#lf-centro').value     = '';
  setLancStatus_(null);
  $('#lf-observacao').value = '';
  // Reset fatura (competência) — começa não-tocada pra auto-sugerir
  $('#lf-fatura-comp').value = '';
  _lancModal._faturaTocada = false;
  // Reset repetição
  setLancRepeticao_('unica');
  $('#lf-parc-period').value = 'mensal';
  $('#lf-parc-intervalo').value = 1;
  $('#lf-parc-num').value = 2;
  $('#lf-parc-ini').value = 1;
  $('#lf-parc-por').checked = false;
  $('#lf-fix-period').value = 'mensal';
  $('#lf-fix-intervalo').value = 1;
  $('#lf-fix-limit').checked = false;
  $('#lf-fix-total-row').classList.add('hidden');
  $('#lf-fix-total').value = 12;
  updateRepIntervaloLabels_();
  if (contas.length >= 1) $('#lf-conta-origem').value  = contas[0].id;
  if (contas.length >= 2) $('#lf-conta-destino').value = contas[1].id;

  // Popula: tanto edit quanto clone aproveitam os campos do original
  if (lanc) {
    // No clone, a data padrão é hoje (e não a data do original)
    $('#lf-data').value       = isClone ? todayISO() : (lanc.data || todayISO());
    // Tira sufixos de parcela "(3/12)" e variantes
    $('#lf-descricao').value  = String(lanc.descricao || '')
      .replace(/\s*\((saída|entrada|crédito[^)]*)\)\s*$/, '')
      .replace(/\s*\(\d+\/\d+\)\s*$/, '');
    setMoneyInputValue_($('#lf-valor'), Math.abs(Number(lanc.valor) || 0));
    if (_lfOndeCombo) {
      if (lanc.conta) _lfOndeCombo.setValue('c:' + lanc.conta);
      else if (lanc.cartao) _lfOndeCombo.setValue('k:' + lanc.cartao);
      else _lfOndeCombo.setValue('');
    }
    $('#lf-categoria').value  = lanc.categoria || '';
    $('#lf-centro').value     = lanc.centro    || '';
    if (isClone) {
      // Clone: status volta a "auto" (data decide)
      setLancStatus_(null);
    } else {
      setLancStatus_(lanc.status);
    }
    $('#lf-observacao').value = lanc.observacao || '';
    // Fatura (competência): se o lançamento já tinha definida, popula e marca como tocada
    if (lanc.cartao && lanc.fatura_competencia) {
      $('#lf-fatura-comp').value = String(lanc.fatura_competencia).slice(0, 7);
      _lancModal._faturaTocada = true;
    }
  }

  // Pills: desabilita troca em edit (clone pode mudar tipo livremente)
  const lockTipo = isEdit;
  $$('.type-tab').forEach(t => {
    t.disabled = lockTipo;
    if (lockTipo) t.classList.add('locked'); else t.classList.remove('locked');
  });

  // Esconde repetição em edit (e em transferência via setLancTipo_)
  $('#lf-row-repeticao').style.display = lanc ? 'none' : '';

  setLancTipo_(tipo);

  $('#lanc-modal').classList.remove('hidden');
  setTimeout(() => $('#lf-valor').focus(), 50);
}

function fillSel_(selector, items, allowEmpty) {
  const sel = $(selector);
  if (!sel) return;
  const prefix = allowEmpty ? '<option value="">— —</option>' : '';
  sel.innerHTML = prefix + (items || []).map(x =>
    '<option value="' + escapeHtml(x.id) + '">' + escapeHtml(x.nome) + '</option>'
  ).join('');
}

/**
 * Combobox genérico: input + dropdown filtrado. Mantém um <input type="hidden"> com o id selecionado.
 * options = [{ value, label, indent?: bool, searchText?: string }]
 */
function setupCombobox_(id, getOptions, onChange) {
  const root = $('#' + id + '-combo');
  if (!root) return null;
  const input  = $('#' + id + '-display');
  const hidden = $('#' + id);
  const list   = $('#' + id + '-list');
  const btnC   = $('#' + id + '-clear');
  const btnT   = $('#' + id + '-toggle');

  let opts = [];
  let visible = [];
  let highlight = -1;

  function render(filter) {
    opts = getOptions() || [];
    const flt = (filter || '').trim().toLowerCase();
    visible = flt
      ? opts.filter(o =>
          !o.header && (
            String(o.label).toLowerCase().indexOf(flt) !== -1 ||
            (o.searchText && String(o.searchText).toLowerCase().indexOf(flt) !== -1)
          )
        )
      : opts;
    if (visible.length === 0) {
      list.innerHTML = '<div class="cb-empty">Sem opções</div>';
    } else {
      list.innerHTML = visible.map((o, i) => {
        if (o.header) {
          return '<div class="cb-header" data-idx="' + i + '">' + escapeHtml(o.label) + '</div>';
        }
        // iconHtml é HTML pré-construído (vem de helpers como contaIconHtml — confiável)
        return '<div class="cb-option' + (o.indent ? ' cb-indent' : '') +
          '" data-idx="' + i + '">' +
          (o.iconHtml || '') +
          escapeHtml(o.label) + '</div>';
      }).join('');
    }
    highlight = -1;
  }

  function open()  { render(input.value); list.classList.remove('hidden'); }
  function close() { list.classList.add('hidden'); }

  function pick(idx) {
    const o = visible[idx];
    if (!o) return;
    input.value  = o.label;
    hidden.value = o.value;
    close();
    if (onChange) onChange(o.value);
  }

  function setValueProgrammatically(value) {
    opts = getOptions() || [];
    const o = opts.find(x => String(x.value) === String(value));
    hidden.value = value || '';
    input.value  = o ? o.label : '';
  }

  function updateHighlight() {
    Array.prototype.forEach.call(list.querySelectorAll('.cb-option'), (el, i) => {
      el.classList.toggle('cb-highlight', i === highlight);
    });
    const hi = list.querySelectorAll('.cb-option')[highlight];
    if (hi) hi.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('blur', () => {
    setTimeout(() => {
      const txt = input.value.trim().toLowerCase();
      const all = getOptions() || [];
      const match = all.find(o => String(o.label).toLowerCase() === txt);
      if (match) {
        input.value  = match.label;
        hidden.value = match.value;
        if (onChange) onChange(match.value);
      } else if (txt === '') {
        hidden.value = '';
        if (onChange) onChange('');
      } else {
        // texto digitado não bate com nenhuma opção — restaura display do hidden
        const cur = all.find(o => String(o.value) === String(hidden.value));
        input.value = cur ? cur.label : '';
      }
      close();
    }, 150);
  });

  function moveHighlight_(delta) {
    let i = highlight;
    for (let step = 0; step < visible.length + 1; step++) {
      i += delta;
      if (i < 0 || i >= visible.length) return;
      if (!visible[i].header) { highlight = i; updateHighlight(); return; }
    }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (list.classList.contains('hidden')) open();
      moveHighlight_(1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      moveHighlight_(-1);
    } else if (e.key === 'Enter') {
      if (highlight >= 0 && visible[highlight] && !visible[highlight].header) {
        e.preventDefault();
        pick(highlight);
      }
    } else if (e.key === 'Escape') {
      close();
    }
  });

  list.addEventListener('mousedown', (e) => {
    const opt = e.target.closest('.cb-option:not(.cb-header)');
    if (!opt) return;
    e.preventDefault();
    pick(parseInt(opt.dataset.idx, 10));
    input.focus();
  });

  btnT.addEventListener('click', (e) => {
    e.stopPropagation();
    if (list.classList.contains('hidden')) { input.focus(); open(); }
    else close();
  });

  btnC.addEventListener('click', (e) => {
    e.stopPropagation();
    input.value = '';
    hidden.value = '';
    close();
    input.focus();
    if (onChange) onChange('');
  });

  return {
    refresh: () => render(input.value),
    setValue: setValueProgrammatically,
    getValue: () => hidden.value
  };
}

function getCategoriaOptions_() {
  const tipo = _lancModal.tipo;
  const allCats = State.cache.categorias || [];
  let cats;
  if (tipo === 'transferencia') cats = allCats.filter(c => c.tipo === 'transferencia');
  else if (tipo === 'receita' || tipo === 'despesa') cats = allCats.filter(c => c.tipo === tipo);
  else cats = allCats;

  const pais = cats.filter(c => !c.pai)
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  const filhosPorPai = {};
  cats.filter(c => c.pai).forEach(c => {
    (filhosPorPai[c.pai] = filhosPorPai[c.pai] || []).push(c);
  });

  const opts = [];
  pais.forEach(p => {
    opts.push({ value: p.id, label: p.nome, indent: false, searchText: p.nome });
    const filhos = (filhosPorPai[p.id] || [])
      .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    filhos.forEach(f => {
      opts.push({
        value: f.id,
        label: f.nome,
        indent: true,
        searchText: p.nome + ' ' + f.nome
      });
    });
  });
  // Órfãos
  const paisIds = new Set(pais.map(p => p.id));
  cats.filter(c => c.pai && !paisIds.has(c.pai)).forEach(f => {
    opts.push({ value: f.id, label: f.nome, indent: false, searchText: f.nome });
  });
  return opts;
}

let _lfCategoriaCombo = null;
let _lfOndeCombo = null;

function getOndeOptions_() {
  const contas  = State.cache.contas  || [];
  const cartoes = State.cache.cartoes || [];
  const opts = [];

  CONTA_TIPO_ORDEM.forEach(tp => {
    if (tp === 'cartao') return; // cartões num bloco próprio depois
    const grupo = contas.filter(c => (c.tipo || 'outra') === tp)
      .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR', { numeric: true }));
    if (grupo.length === 0) return;
    opts.push({ header: true, label: CONTA_TIPO_LABEL[tp] || tp });
    grupo.forEach(c => {
      opts.push({
        value: 'c:' + c.id,
        label: c.nome,
        iconHtml: contaIconHtml(c, 14),
        searchText: c.nome + ' ' + (CONTA_TIPO_LABEL[tp] || ''),
        _conta: c
      });
    });
  });

  // Contas com tipo desconhecido
  const conhecidos = new Set(CONTA_TIPO_ORDEM);
  const orfas = contas.filter(c => !conhecidos.has(c.tipo || 'outra'));
  if (orfas.length > 0) {
    opts.push({ header: true, label: 'Outras' });
    orfas.forEach(c => {
      opts.push({
        value: 'c:' + c.id,
        label: c.nome,
        iconHtml: contaIconHtml(c, 14),
        searchText: c.nome,
        _conta: c
      });
    });
  }

  // Cartões
  if (cartoes.length > 0) {
    const sortedCartoes = cartoes.slice()
      .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR', { numeric: true }));
    opts.push({ header: true, label: 'Cartões de crédito' });
    sortedCartoes.forEach(k => {
      opts.push({
        value: 'k:' + k.id,
        label: k.nome,
        iconHtml: contaIconHtml(Object.assign({ tipo: 'cartao' }, k), 14),
        searchText: k.nome + ' cartão ' + (k.bandeira || ''),
        _conta: { tipo: 'cartao', nome: k.nome }
      });
    });
  }

  return opts;
}

/**
 * Popula um <select> de categorias com hierarquia visual: pai + subs indentados com ↳.
 */
function fillCategoriaSel_(selector, cats, currentValue, allowEmpty) {
  const sel = $(selector);
  if (!sel) return;
  const pais = cats.filter(c => !c.pai)
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  const filhosPorPai = {};
  cats.filter(c => c.pai).forEach(c => {
    (filhosPorPai[c.pai] = filhosPorPai[c.pai] || []).push(c);
  });
  const html = [];
  if (allowEmpty) html.push('<option value="">— —</option>');
  pais.forEach(p => {
    html.push('<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.nome) + '</option>');
    const filhos = (filhosPorPai[p.id] || [])
      .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    filhos.forEach(f => {
      html.push('<option value="' + escapeHtml(f.id) + '">   ↳ ' + escapeHtml(f.nome) + '</option>');
    });
  });
  // órfãos (pai não está na lista filtrada)
  const paisIds = new Set(pais.map(p => p.id));
  cats.filter(c => c.pai && !paisIds.has(c.pai)).forEach(f => {
    html.push('<option value="' + escapeHtml(f.id) + '">' + escapeHtml(f.nome) + '</option>');
  });
  sel.innerHTML = html.join('');
  if (currentValue) sel.value = currentValue;
}

/** Replica competenciaFaturaPorData_ do backend (mês de vencimento YYYY-MM). */
function _competenciaFaturaFront_(cartao, dataStr) {
  const F = Math.max(1, Math.min(31, Number(cartao.dia_fechamento) || 1));
  const V = Math.max(1, Math.min(31, Number(cartao.dia_vencimento) || F));
  const m = String(dataStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  let ano = +m[1], mes = +m[2]; const dia = +m[3];
  let fechAno = ano, fechMes = mes;
  if (dia > F) { fechMes++; if (fechMes > 12) { fechMes = 1; fechAno++; } }
  let vAno = fechAno, vMes = fechMes;
  if (F >= V) { vMes++; if (vMes > 12) { vMes = 1; vAno++; } }
  return vAno + '-' + String(vMes).padStart(2, '0');
}

/** Mostra/esconde o campo "Fatura" e pré-preenche a sugestão (se não tocado manualmente). */
function _atualizarFaturaComp_(forcar) {
  const row = $('#lf-row-fatura');
  if (!row) return;
  const onde = $('#lf-onde') ? $('#lf-onde').value : '';
  const ehCartao = onde.indexOf('k:') === 0 && _lancModal.tipo !== 'transferencia';
  row.style.display = ehCartao ? '' : 'none';
  if (!ehCartao) return;
  if (_lancModal._faturaTocada && !forcar) return;
  const cartao = (State.cache.cartoes || []).find(c => String(c.id) === String(onde.slice(2)));
  if (!cartao) return;
  const sug = _competenciaFaturaFront_(cartao, $('#lf-data').value);
  if (sug) { $('#lf-fatura-comp').value = sug; _lancModal._faturaTocada = false; }
}

/**
 * Abre o modal de escolha de escopo para lançamentos de série (parcelados/fixos).
 * Retorna Promise<'one'|'forward'|'all'|null>. null = usuário cancelou.
 * Se o lançamento não pertence a uma série, retorna 'one' sem perguntar.
 *
 * @param {string} actionLabel - "Editar" ou "Excluir" (para o título do modal)
 * @param {string} lancId - ID do lançamento de referência
 */
async function askSerieScope_(actionLabel, lancId) {
  let info;
  try { info = await run('getLancamentoSerieInfo', lancId); }
  catch (e) { return 'one'; }

  if (!info || !info.is_series) return 'one';

  return new Promise(resolve => {
    const modal = $('#serie-modal');
    $('#serie-modal-title').textContent = actionLabel + ' lançamento da série';
    $('#serie-modal-desc').innerHTML =
      'Este lançamento faz parte de uma série de <strong>' + info.total +
      '</strong> repetições. Escolha o que ' + actionLabel.toLowerCase() + ':';
    $('#serie-forward-count').textContent =
      'Afeta ' + info.forward_count + ' lançamento(s) — este e os de datas posteriores.';
    $('#serie-all-count').textContent =
      'Afeta todos os ' + info.total + ' lançamentos (passados e futuros).';

    // Reset para 'one' por padrão
    $$('input[name="serie-scope"]', modal).forEach(r => { r.checked = r.value === 'one'; });

    let resolved = false;
    const cleanup = () => {
      modal.classList.add('hidden');
      document.removeEventListener('keydown', onKey);
    };
    const finish = (val) => {
      if (resolved) return;
      resolved = true;
      cleanup();
      resolve(val);
    };
    const cancel = () => finish(null);
    const ok = () => {
      const checked = $('input[name="serie-scope"]:checked');
      finish(checked ? checked.value : 'one');
    };
    const onKey = (e) => {
      if (e.key === 'Escape') cancel();
      else if (e.key === 'Enter') ok();
    };

    $('#serie-modal-bg').onclick     = cancel;
    $('#serie-modal-close').onclick  = cancel;
    $('#serie-modal-cancel').onclick = cancel;
    $('#serie-modal-ok').onclick     = ok;
    document.addEventListener('keydown', onKey);

    modal.classList.remove('hidden');
  });
}

async function saveLancModal_(criarOutro) {
  const tipo = _lancModal.tipo;
  const lanc = _lancModal.editando;

  const dataVal   = $('#lf-data').value;
  const descricao = $('#lf-descricao').value.trim();
  const valorAbs  = Math.abs(moneyInputValue_($('#lf-valor')));

  if (!dataVal)          return toast('Informe a data.', true);
  if (!descricao)        return toast('Informe a descrição.', true);
  if (valorAbs <= 0)     return toast('Valor deve ser maior que zero.', true);

  const unlock = lockSaveButtons_('#lanc-modal-save', '#lanc-modal-save-new', '#lanc-modal-cancel', '#lanc-modal-close');
  showLoader(true);
  try {
    if (tipo === 'transferencia') {
      const origem  = $('#lf-conta-origem').value;
      const destino = $('#lf-conta-destino').value;
      if (!origem || !destino) { toast('Informe contas de origem e destino.', true); return; }
      if (origem === destino)  { toast('Origem e destino devem ser diferentes.', true); return; }

      const baseTransf = {
        data: dataVal, descricao: descricao, valor: valorAbs,
        conta_origem: origem, conta_destino: destino,
        status: effectiveLancStatus_()
      };

      // Repetição: só aplica em modo NOVO (clone ou novo). Edição não tem rep.
      const rep = (!lanc) ? _lancModal.repeticao : 'unica';

      if (rep === 'parcelada') {
        const periodicidade = $('#lf-parc-period').value;
        const intervalo = Math.max(1, parseInt($('#lf-parc-intervalo').value, 10) || 1);
        const total = Math.max(2, parseInt($('#lf-parc-num').value, 10) || 2);
        const inicial = Math.max(1, Math.min(total, parseInt($('#lf-parc-ini').value, 10) || 1));
        await run('criarTransferenciaSerie', baseTransf, total, inicial, periodicidade, intervalo);
        const qt = total - inicial + 1;
        toast(qt + ' transferência' + (qt === 1 ? '' : 's') + ' criada' + (qt === 1 ? '' : 's') + '.');
      } else if (rep === 'fixa') {
        // Fixa: cria N ocorrências iguais (12 por padrão, ou totalOcc se definido)
        const periodicidade = $('#lf-fix-period').value;
        const intervalo = Math.max(1, parseInt($('#lf-fix-intervalo').value, 10) || 1);
        const total = $('#lf-fix-limit').checked
          ? Math.max(1, parseInt($('#lf-fix-total').value, 10) || 12)
          : 12;
        await run('criarTransferenciaSerie', baseTransf, total, 1, periodicidade, intervalo);
        toast(total + ' transferência' + (total === 1 ? '' : 's') + ' criada' + (total === 1 ? '' : 's') + '.');
      } else {
        await run('criarTransferencia', baseTransf);
        toast('Transferência registrada.');
      }
    } else {
      const signed = (tipo === 'despesa') ? -valorAbs : valorAbs;
      const onde = $('#lf-onde') ? $('#lf-onde').value : '';
      let conta = '', cartao = '';
      if (onde.indexOf('c:') === 0) conta = onde.slice(2);
      else if (onde.indexOf('k:') === 0) cartao = onde.slice(2);
      if (!conta && !cartao) { toast('Informe Conta ou Cartão.', true); return; }

      const payload = {
        data: dataVal, descricao: descricao, valor: signed,
        conta: conta, cartao: cartao,
        categoria: $('#lf-categoria').value,
        centro:    $('#lf-centro').value,
        status:    effectiveLancStatus_(),
        observacao: $('#lf-observacao').value,
        // Competência da fatura só faz sentido pra cartão
        fatura_competencia: cartao ? ($('#lf-fatura-comp').value || '') : ''
      };

      if (lanc) {
        payload.id = lanc.id;
        // Se faz parte de uma série, pergunta o escopo
        if (lanc.recorrencia_id) {
          const scope = await askSerieScope_('Editar', lanc.id);
          if (!scope) {
            // Cancelou — não salva
            return;
          }
          if (scope === 'one') {
            await run('saveLancamento', payload);
            toast('Lançamento atualizado.');
          } else {
            const r = await run('updateLancamentoSerie', lanc.id, scope, payload);
            toast(r.count + ' lançamento' + (r.count === 1 ? '' : 's') + ' atualizado' + (r.count === 1 ? '' : 's') + '.');
          }
        } else {
          await run('saveLancamento', payload);
          toast('Lançamento atualizado.');
        }
      } else {
        const rep = _lancModal.repeticao;
        if (rep === 'parcelada') {
          const periodicidade = $('#lf-parc-period').value;
          const intervalo = Math.max(1, parseInt($('#lf-parc-intervalo').value, 10) || 1);
          const total = Math.max(2, parseInt($('#lf-parc-num').value, 10) || 2);
          const inicial = Math.max(1, Math.min(total, parseInt($('#lf-parc-ini').value, 10) || 1));
          const porParcela = $('#lf-parc-por').checked;
          const valorTotalAbs = porParcela ? valorAbs * total : valorAbs;
          payload.valor = (tipo === 'despesa') ? -valorTotalAbs : valorTotalAbs;
          await run('criarParcelamento', payload, total, inicial, periodicidade, intervalo);
          const qt = total - inicial + 1;
          toast(qt + ' parcela' + (qt === 1 ? '' : 's') + ' criada' + (qt === 1 ? '' : 's') + '.');
        } else if (rep === 'fixa') {
          const periodicidade = $('#lf-fix-period').value;
          const intervalo = Math.max(1, parseInt($('#lf-fix-intervalo').value, 10) || 1);
          const totalOcc = $('#lf-fix-limit').checked
            ? Math.max(1, parseInt($('#lf-fix-total').value, 10) || 1) : 0;
          const dia = new Date(dataVal + 'T00:00:00').getDate();
          await run('saveRecorrencia', {
            descricao: descricao,
            valor: signed,
            conta: payload.conta,
            cartao: payload.cartao,
            categoria: payload.categoria,
            centro: payload.centro,
            periodicidade: periodicidade,
            intervalo: intervalo,
            dia: dia,
            proxima_data: dataVal,
            total_ocorrencias: totalOcc,
            ativo: true
          });
          toast(totalOcc > 0
            ? 'Recorrência criada (' + totalOcc + ' ocorrências).'
            : 'Recorrência criada (12 meses gerados).');
        } else {
          await run('saveLancamento', payload);
          toast('Lançamento salvo.');
        }
      }
    }

    // Fecha (ou limpa para outro) ANTES do reload — UX percebida muito mais rápida.
    if (criarOutro && !lanc) {
      $('#lf-descricao').value  = '';
      const sugReset2 = $('#lf-regra-sugestao'); if (sugReset2) sugReset2.classList.add('hidden');
      setMoneyInputValue_($('#lf-valor'), 0); $('#lf-valor').value = '';
      $('#lf-observacao').value = '';
      $('#lf-parcelas').value   = 1;
      setTimeout(() => $('#lf-descricao').focus(), 50);
    } else {
      closeLancModal_();
    }

    // Reload em background (não bloqueia o usuário) — recarrega a tela visível
    const recarregar = (State.view === 'cartoes' && typeof renderFatura === 'function')
      ? renderFatura : reloadLancamentos;
    recarregar().catch(err => toast(err.message, true));
  } catch (e) {
    toast(e.message, true);
  } finally {
    unlock();
    showLoader(false);
  }
}

/**
 * Avalia uma expressão matemática simples de forma SEGURA (sem `eval`).
 * Aceita: dígitos, vírgula/ponto, + − × ÷ ( ).
 * Retorna { ok: bool, valor: number }.
 */
function _evalSimpleExpr_(s) {
  s = String(s || '').replace(/\s+/g, '').replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  if (!s) return { ok: false, valor: 0 };
  if (!/^[\d.+\-*/()]+$/.test(s)) return { ok: false, valor: 0 };

  // Shunting-yard → RPN → avalia
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const out = [], op = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/[\d.]/.test(c)) {
      let j = i;
      while (j < s.length && /[\d.]/.test(s[j])) j++;
      out.push(parseFloat(s.slice(i, j)));
      i = j;
      continue;
    }
    if (c === '(') { op.push(c); i++; continue; }
    if (c === ')') {
      while (op.length && op[op.length - 1] !== '(') out.push(op.pop());
      if (!op.length) return { ok: false, valor: 0 };
      op.pop();
      i++;
      continue;
    }
    if ('+-*/'.indexOf(c) !== -1) {
      // unário (ex.: -5, 2*-3)
      if (c === '-' && (i === 0 || '+-*/('.indexOf(s[i - 1]) !== -1)) {
        out.push(0);
      }
      while (op.length && op[op.length - 1] !== '(' && prec[op[op.length - 1]] >= prec[c]) {
        out.push(op.pop());
      }
      op.push(c);
      i++;
      continue;
    }
    return { ok: false, valor: 0 };
  }
  while (op.length) {
    const o = op.pop();
    if (o === '(' || o === ')') return { ok: false, valor: 0 };
    out.push(o);
  }

  const stack = [];
  for (const tok of out) {
    if (typeof tok === 'number') { stack.push(tok); continue; }
    const b = stack.pop(), a = stack.pop();
    if (a === undefined || b === undefined) return { ok: false, valor: 0 };
    let r;
    if (tok === '+') r = a + b;
    else if (tok === '-') r = a - b;
    else if (tok === '*') r = a * b;
    else if (tok === '/') { if (b === 0) return { ok: false, valor: 0 }; r = a / b; }
    else return { ok: false, valor: 0 };
    stack.push(r);
  }
  if (stack.length !== 1 || isNaN(stack[0])) return { ok: false, valor: 0 };
  return { ok: true, valor: stack[0] };
}

/**
 * Abre o modal de pagamento de fatura.
 * @param {Object} opts - { cartaoId, valor (positivo), data (yyyy-MM-dd do vencimento) }
 */
async function openPagarFaturaModal_(opts) {
  opts = opts || {};
  const cartao = (State.cache.cartoes || []).find(c => String(c.id) === String(opts.cartaoId));
  if (!cartao) { toast('Cartão não encontrado.', true); return; }

  const modal = $('#pagar-fatura-modal');
  if (!modal) return;

  // Competência-alvo (mês de vencimento da fatura sendo paga):
  //  - aba Cartões passa ano/mes direto
  //  - virtual "Fatura a pagar" passa a data do vencimento
  let alvoAno = opts.ano, alvoMes = opts.mes;
  let valor = Number(opts.valor) || 0;
  let dataDefault = opts.data || '';
  if (!alvoAno || !alvoMes) {
    const dt = new Date((opts.data || todayISO()) + 'T00:00:00');
    alvoAno = dt.getFullYear(); alvoMes = dt.getMonth() + 1;
  }
  // Se não veio valor/data (chamada da aba), busca a fatura pra preencher
  if (!valor || !dataDefault) {
    try {
      const fatura = await run('getFatura', cartao.id, alvoAno, alvoMes);
      if (!valor) valor = Math.abs(Number(fatura.total) || 0);
      if (!dataDefault) dataDefault = fatura.ciclo.vencimento;
      if (fatura.status === 'paga') {
        if (!confirm('Esta fatura já consta como paga. Registrar outro pagamento mesmo assim?')) return;
      }
    } catch (e) { toast(e.message, true); return; }
  }
  if (valor < 0.01) { toast('Fatura sem valor para pagar.', true); return; }
  modal._alvoAno = alvoAno;
  modal._alvoMes = alvoMes;

  // Popula campos
  $('#pf-cartao').value = cartao.nome;
  $('#pf-valor').value  = fmtBRL(Math.abs(valor));
  $('#pf-data').value   = dataDefault || todayISO();
  $('#pf-status').value = 'pendente';

  // Conta a debitar: lista todas as operacionais (não-empréstimo), pré-seleciona a conta_pagamento do cartão
  const sel = $('#pf-conta');
  const contas = (State.cache.contas || []).filter(c => c.tipo !== 'emprestimo');
  sel.innerHTML = contas.length
    ? contas.map(c => '<option value="' + escapeHtml(c.id) + '"' +
        (String(c.id) === String(cartao.conta_pagamento) ? ' selected' : '') + '>' +
        escapeHtml(c.nome) + '</option>').join('')
    : '<option value="">Sem contas operacionais cadastradas</option>';

  const fechar = () => {
    modal.classList.add('hidden');
    document.removeEventListener('keydown', onKey);
  };
  const confirmar = async () => {
    const contaId = sel.value;
    const dataPg  = $('#pf-data').value;
    const stPg    = $('#pf-status').value || 'pendente';
    if (!contaId) { toast('Selecione a conta a debitar.', true); return; }
    if (!dataPg)  { toast('Informe a data do pagamento.', true); return; }
    const okBtn = $('#pagar-fatura-ok');
    okBtn.disabled = true;
    showLoader(true);
    try {
      // Usa a competência-ALVO (fatura escolhida), não a data do pagamento —
      // assim pagar adiantado/atrasado não joga o pagamento na fatura errada.
      const r = await run('pagarFatura', cartao.id, modal._alvoAno, modal._alvoMes, dataPg, stPg, contaId);
      toast('Fatura paga: ' + fmtBRL(r.total_pago) + '.');
      fechar();
      // Atualiza a tela visível (aba Cartões ou Movimentações)
      if (State.view === 'cartoes' && typeof renderFatura === 'function') await renderFatura();
      else await reloadLancamentos();
    } catch (e) {
      toast(e.message, true);
    } finally {
      okBtn.disabled = false;
      showLoader(false);
    }
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); fechar(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); confirmar(); }
  };

  $('#pagar-fatura-modal-close').onclick  = fechar;
  $('#pagar-fatura-modal-bg').onclick     = fechar;
  $('#pagar-fatura-cancel').onclick       = fechar;
  $('#pagar-fatura-ok').onclick           = confirmar;
  document.addEventListener('keydown', onKey);

  modal.classList.remove('hidden');
  setTimeout(() => sel.focus(), 50);
}

function openCalcModal_(valorInicial, onApply) {
  const modal = $('#calc-modal');
  const expr  = $('#calc-expr');
  const res   = $('#calc-result');
  if (!modal || !expr || !res) return;

  // Pré-preenche com o valor atual (se houver) pra o usuário continuar a conta
  expr.value = (valorInicial && Number(valorInicial) > 0)
    ? String(valorInicial).replace('.', ',')
    : '';

  const atualizarRes = () => {
    if (!expr.value.trim()) { res.textContent = '= 0,00'; res.classList.remove('calc-err'); return; }
    const r = _evalSimpleExpr_(expr.value);
    if (r.ok) {
      res.textContent = '= ' + fmtBRL(r.valor).replace('R$ ', '');
      res.classList.remove('calc-err');
    } else {
      res.textContent = 'expressão inválida';
      res.classList.add('calc-err');
    }
  };

  const inserir = (txt) => {
    const start = expr.selectionStart || expr.value.length;
    const end   = expr.selectionEnd   || expr.value.length;
    expr.value = expr.value.slice(0, start) + txt + expr.value.slice(end);
    const pos = start + txt.length;
    expr.setSelectionRange(pos, pos);
    expr.focus();
    atualizarRes();
  };
  const apagar = () => {
    const start = expr.selectionStart || expr.value.length;
    const end   = expr.selectionEnd   || expr.value.length;
    if (start === end && start > 0) {
      expr.value = expr.value.slice(0, start - 1) + expr.value.slice(end);
      expr.setSelectionRange(start - 1, start - 1);
    } else {
      expr.value = expr.value.slice(0, start) + expr.value.slice(end);
      expr.setSelectionRange(start, start);
    }
    expr.focus();
    atualizarRes();
  };
  const limpar = () => { expr.value = ''; expr.focus(); atualizarRes(); };
  const resolver = () => {
    const r = _evalSimpleExpr_(expr.value);
    if (r.ok) {
      expr.value = String(Math.round(r.valor * 100) / 100).replace('.', ',');
      atualizarRes();
    }
  };

  $$('.calc-key', modal).forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.calc;
      if (k === 'C')         limpar();
      else if (k === 'back') apagar();
      else if (k === '=')    resolver();
      else                   inserir(k);
    };
  });

  const fechar = () => {
    modal.classList.add('hidden');
    document.removeEventListener('keydown', onKey);
  };
  const aplicar = () => {
    const r = _evalSimpleExpr_(expr.value);
    if (!r.ok) return;
    if (onApply) onApply(Math.abs(r.valor)); // valor sempre positivo (sinal é tratado pelo tipo do lançamento)
    fechar();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); fechar(); }
    else if (e.key === 'Enter') { e.preventDefault(); aplicar(); }
  };

  $('#calc-modal-close').onclick  = fechar;
  $('#calc-modal-bg').onclick     = fechar;
  $('#calc-modal-cancel').onclick = fechar;
  $('#calc-modal-ok').onclick     = aplicar;
  expr.oninput = atualizarRes;
  document.addEventListener('keydown', onKey);

  atualizarRes();
  modal.classList.remove('hidden');
  setTimeout(() => expr.focus(), 50);
}

/**
 * Mostra um painel "Regra detectada: X → Categoria/Centro" abaixo do input de descrição
 * quando o texto digitado bate com alguma regra ativa (`condicao_operador: contains`).
 * Click em "Aplicar" preenche os selects de categoria/centro.
 */
function _atualizarSugestaoRegra_(texto) {
  const painel = $('#lf-regra-sugestao');
  if (!painel) return;
  const t = String(texto || '').trim().toLowerCase();
  if (t.length < 3) { painel.classList.add('hidden'); return; }

  const regras = (State.cache.regras || []).filter(r =>
    Utils_toBool_(r.ativo) &&
    r.condicao_campo === 'descricao' &&
    r.condicao_operador === 'contains'
  );
  // Acha todas as regras que batem (cat + centro) e agrupa pelo condicao_valor
  const matches = regras.filter(r => t.indexOf(String(r.condicao_valor || '').toLowerCase()) !== -1);
  if (matches.length === 0) { painel.classList.add('hidden'); return; }

  // Junta categoria e centro da mesma palavra-chave (pode ter 1 regra de cada)
  // Pega a primeira ação de cada tipo
  let catId = '', centroId = '', palavra = '';
  matches.forEach(r => {
    if (r.acao_campo === 'categoria' && !catId)    { catId = r.acao_valor;    if (!palavra) palavra = r.condicao_valor; }
    if (r.acao_campo === 'centro'    && !centroId) { centroId = r.acao_valor; if (!palavra) palavra = r.condicao_valor; }
  });
  if (!catId && !centroId) { painel.classList.add('hidden'); return; }

  const catNome    = catId    ? _nameById_(State.cache.categorias, catId)    : '';
  const centroNome = centroId ? _nameById_(State.cache.centros,    centroId) : '';

  // Já está aplicado? Esconde
  const catAtual    = $('#lf-categoria') ? $('#lf-categoria').value : '';
  const centroAtual = $('#lf-centro')    ? $('#lf-centro').value    : '';
  if ((catId === catAtual || !catId) && (centroId === centroAtual || !centroId)) {
    painel.classList.add('hidden');
    return;
  }

  const partes = [];
  if (catNome)    partes.push('categoria <strong>' + escapeHtml(catNome)    + '</strong>');
  if (centroNome) partes.push('centro <strong>'    + escapeHtml(centroNome) + '</strong>');

  painel.innerHTML =
    '<span class="material-icons-outlined">auto_fix_high</span>' +
    '<span class="regra-info">Regra "' + escapeHtml(palavra) + '" → ' + partes.join(' · ') + '</span>' +
    '<button type="button" class="btn-aplicar">Aplicar</button>' +
    '<button type="button" class="btn-dismiss" title="Dispensar">×</button>';
  painel.classList.remove('hidden');

  painel.querySelector('.btn-aplicar').onclick = () => {
    if (catId && _lfCategoriaCombo) _lfCategoriaCombo.setValue(catId);
    if (centroId) {
      const sel = $('#lf-centro');
      if (sel) sel.value = centroId;
    }
    painel.classList.add('hidden');
  };
  painel.querySelector('.btn-dismiss').onclick = () => painel.classList.add('hidden');
}

/** Wrap leve do Utils.toBool no escopo do app (Apps Script side é só backend). */
function Utils_toBool_(v) {
  if (v === true || v === 1) return true;
  if (v === false || v === 0 || v === null || v === undefined) return false;
  const s = String(v).toLowerCase().trim();
  return s === 'true' || s === 'sim' || s === 'yes' || s === '1';
}

function setupLancModalOnce_() {
  if (_lancModal.setupDone) return;
  _lancModal.setupDone = true;

  // Combobox de categoria (typeahead)
  _lfCategoriaCombo = setupCombobox_('lf-categoria', getCategoriaOptions_);
  // Combobox unificado de Conta / Cartão — ao trocar, recalcula a fatura sugerida
  _lfOndeCombo = setupCombobox_('lf-onde', getOndeOptions_, () => {
    _lancModal._faturaTocada = false;
    _atualizarFaturaComp_(true);
  });

  // Campo de fatura: ao editar manualmente, marca como "tocado" (não auto-sobrescreve)
  const faturaEl = $('#lf-fatura-comp');
  if (faturaEl) {
    faturaEl.addEventListener('input', () => { _lancModal._faturaTocada = true; });
  }

  $$('.type-tab').forEach(t => {
    t.onclick = () => { if (!t.disabled) setLancTipo_(t.dataset.tipo); };
  });
  $('#lanc-modal-close').onclick  = closeLancModal_;
  $('#lanc-modal-cancel').onclick = closeLancModal_;
  $('#lanc-modal-bg').onclick     = closeLancModal_;
  $('#lanc-modal-save').onclick     = () => saveLancModal_(false);
  $('#lanc-modal-save-new').onclick = () => saveLancModal_(true);

  // Botão calculadora ao lado do campo Valor
  const calcBtn = $('#lf-valor-calc');
  if (calcBtn) calcBtn.onclick = () => {
    const atual = moneyInputValue_($('#lf-valor'));
    openCalcModal_(atual, (resultado) => {
      setMoneyInputValue_($('#lf-valor'), resultado);
    });
  };

  // Sugestão de regra ao digitar descrição
  const desc = $('#lf-descricao');
  if (desc) {
    let timer = null;
    desc.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => _atualizarSugestaoRegra_(desc.value), 250);
    });
  }

  // Quando a data muda: atualiza hint de status + recalcula fatura sugerida
  const dataEl = $('#lf-data');
  if (dataEl) dataEl.onchange = () => {
    if (!_lancModal.status) setLancStatus_(null);
    _atualizarFaturaComp_();
  };
  $$('.status-btn').forEach(b => {
    b.onclick = () => {
      // Toggle: clicar no mesmo botão desmarca (volta ao automático)
      if (_lancModal.status === b.dataset.status) setLancStatus_(null);
      else setLancStatus_(b.dataset.status);
    };
  });
  $$('input[name="lf-rep"]').forEach(r => {
    r.onchange = () => setLancRepeticao_(r.value);
  });
  $('#lf-fix-limit').onchange = (e) => {
    $('#lf-fix-total-row').classList.toggle('hidden', !e.target.checked);
  };
  $('#lf-parc-period').onchange = updateRepIntervaloLabels_;
  $('#lf-fix-period').onchange  = updateRepIntervaloLabels_;

  document.addEventListener('keydown', (e) => {
    const modal = $('#lanc-modal');
    if (!modal || modal.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLancModal_();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveLancModal_(false);
  });
}

    t.classList.toggle('active', t.dataset.cad === State.cadAtual);
    t.onclick = () => { State.cadAtual = t.dataset.cad; initCadastros(); };
  });

  showLoader(true);
  try {
    await loadAux(true);
    renderCadastro(State.cadAtual);
    $('#btn-novo-cadastro').onclick = () => openCadastroModal(State.cadAtual, null);
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function renderCadastro(key) {
  const schema = CadastroSchemas[key];
  $('#cad-title').textContent = schema.title;

  const thead = $('#cad-thead');
  const tbody = $('#cad-tbody');

  thead.innerHTML = '<tr>' +
    schema.cols.map(c => '<th class="' + (c.align || '') + '">' + escapeHtml(c.label) + '</th>').join('') +
    '<th></th></tr>';

  const items = State.cache[key] || [];
  tbody.innerHTML = '';
  $('#cad-empty').classList.toggle('hidden', items.length > 0);

  items.forEach(item => {
    const tr = document.createElement('tr');
    const cells = schema.cols.map(c => {
      const raw = item[c.key];
      const val = c.fmt ? c.fmt(raw, item) : raw;
      const safe = c.html ? (val == null ? '' : val) : escapeHtml(val == null ? '' : val);
      return '<td class="' + (c.align || '') + '">' + safe + '</td>';
    }).join('');
    tr.innerHTML = cells +
      '<td>' +
        '<div class="row-actions">' +
          '<button class="icon-btn" data-act="edit" data-id="' + escapeHtml(item.id) + '" title="Editar"><span class="material-icons-outlined">edit</span></button>' +
          '<button class="icon-btn" data-act="del"  data-id="' + escapeHtml(item.id) + '" title="Excluir"><span class="material-icons-outlined">delete</span></button>' +
        '</div>' +
      '</td>';
    tbody.appendChild(tr);
  });

  tbody.onclick = async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const item = items.find(x => String(x.id) === String(id));
    if (btn.dataset.act === 'edit') {
      openCadastroModal(key, item);
    } else if (btn.dataset.act === 'del') {
      if (!confirm('Excluir?')) return;
      try {
        showLoader(true);
        await run(schema.del, id);
        toast('Excluído');
        clearAuxCache();
        await initCadastros();
      } catch (err) {
        toast(err.message, true);
      } finally {
        showLoader(false);
      }
    }
  };
}

function openCadastroModal(key, item) {
  if (key === 'contas')  { openContaModal(item); return; }
  if (key === 'cartoes') { openCartaoModal(item); return; }

  const schema = CadastroSchemas[key];
  const fields = schema.fields().map(f => Object.assign({}, f, {
    value: item && item[f.name] !== undefined && item[f.name] !== '' ? item[f.name] : f.value
  }));

  const title = (item ? 'Editar ' : 'Novo ') + schema.singular;

  openModal(title, fields, async (data) => {
    if (item) data.id = item.id;
    await run(schema.save, data);
    toast('Salvo');
    clearAuxCache();
    await initCadastros();
  });
}

function openModal(title, fields, onSave) {
  $('#modal-title').textContent = title;
  const form = $('#modal-form');
  form.innerHTML = '';

  fields.forEach(f => {
    const row = document.createElement('div');
    row.className = 'form-row';

    const id = 'fld-' + f.name;
    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = f.label;
    row.appendChild(label);

    let input;
    if (f.type === 'select') {
      input = document.createElement('select');
      (f.options || []).forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.value;
        o.textContent = opt.label;
        if (String(opt.value) === String(f.value !== undefined ? f.value : '')) o.selected = true;
        input.appendChild(o);
      });
    } else if (f.type === 'textarea') {
      input = document.createElement('textarea');
      input.rows = 3;
      input.value = f.value || '';
    } else if (f.type === 'money') {
      input = document.createElement('input');
      input.dataset.moneyInput = '1';
    } else {
      input = document.createElement('input');
      input.type = f.type || 'text';
      if (f.step) input.step = f.step;
      input.value = f.value !== undefined && f.value !== null ? f.value : '';
    }
    input.id = id;
    input.name = f.name;
    if (f.required) input.required = true;

    row.appendChild(input);
    form.appendChild(row);

    if (f.type === 'money') {
      setupMoneyInput_(input);
      setMoneyInputValue_(input, f.value || 0);
    }
  });

  const modal = $('#modal');
  modal.classList.remove('hidden');

  const close = () => modal.classList.add('hidden');
  $('#modal-close').onclick  = close;
  $('#modal-cancel').onclick = close;
  $('#modal-bg').onclick     = close;

  $('#modal-save').onclick = async () => {
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const data = {};
    fields.forEach(f => {
      const el = form.querySelector('[name="' + f.name + '"]');
      if (!el) { data[f.name] = ''; return; }
      if (f.type === 'money') data[f.name] = moneyInputValue_(el);
      else data[f.name] = el.value;
    });
    try {
      showLoader(true);
      await onSave(data);
      close();
    } catch (e) {
      toast(e.message, true);
    } finally {
      showLoader(false);
    }
  };
}

function _authSave_(email) {
  try {
    localStorage.setItem(AUTH_LS_KEY, JSON.stringify({
      email: email,
      ts: Date.now()
    }));
  } catch (e) {}
}

function _authLoad_() {
  try {
    const raw = localStorage.getItem(AUTH_LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function _authClear_() {
  try { localStorage.removeItem(AUTH_LS_KEY); } catch (e) {}
}

function _authShowPane_(mode) {
  const overlay = $('#auth-overlay');
  overlay.classList.remove('hidden');
  $$('.auth-pane', overlay).forEach(p => {
    p.classList.toggle('hidden', p.dataset.authMode !== mode);
  });
}

function _authHideOverlay_() {
  $('#auth-overlay').classList.add('hidden');
}

function _authShowError_(paneMode, msg) {
  const el = $('#auth-' + paneMode + '-error');
  if (!el) return;
  if (msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function _authResetInactivity_() {
  AuthState.lastActivity = Date.now();
}

function _authStartInactivityTimer_() {
  if (AuthState.inactivityTimer) clearInterval(AuthState.inactivityTimer);
  AuthState.lastActivity = Date.now();

  // Eventos que resetam o timer
  const events = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
  events.forEach(ev => {
    document.addEventListener(ev, _authResetInactivity_, { passive: true });
  });

  AuthState.inactivityTimer = setInterval(() => {
    if (!AuthState.authenticated) return;
    const elapsedMin = (Date.now() - AuthState.lastActivity) / 60000;
    if (elapsedMin >= AuthState.timeoutMinutes) {
      _authLock_();
    }
  }, 15000); // checa a cada 15s
}

function _authLock_() {
  AuthState.authenticated = false;
  $('#auth-locked-email').textContent = AuthState.email || '';
  $('#auth-locked-pwd').value = '';
  _authShowError_('locked', '');
  _authShowPane_('locked');
  setTimeout(() => { const i = $('#auth-locked-pwd'); if (i) i.focus(); }, 50);
}

function _authLogout_() {
  _authClear_();
  AuthState.authenticated = false;
  // Recarrega a página para garantir estado limpo
  location.reload();
}

async function _authBoot_() {
  _authShowPane_('loading');
  let status;
  try {
    status = await run('getAuthStatus');
  } catch (e) {
    _authShowPane_('loading');
    $('.auth-pane[data-auth-mode="loading"] .auth-loading span:last-child').textContent =
      'Erro: ' + e.message;
    return;
  }

  AuthState.email = status.email || '';
  AuthState.timeoutMinutes = status.timeout_minutes || 15;

  // 1) Setup mode: ninguém cadastrado
  if (status.setup_needed) {
    $('#auth-setup-email').textContent = AuthState.email;
    _authShowPane_('setup');
    setTimeout(() => { const i = $('#auth-setup-pwd'); if (i) i.focus(); }, 50);
    return;
  }

  // 2) Negado: email Google atual não é autorizado
  if (!status.is_authorized) {
    $('#auth-denied-email').textContent = AuthState.email;
    _authShowPane_('denied');
    return;
  }

  // 3) Sessão salva ainda válida? (não passou do timeout)
  const saved = _authLoad_();
  if (saved && saved.email === AuthState.email) {
    const elapsedMin = (Date.now() - (saved.ts || 0)) / 60000;
    if (elapsedMin < AuthState.timeoutMinutes) {
      // Sessão ativa: entra direto
      _authComplete_();
      return;
    }
    // expirou: pede senha
    _authClear_();
  }

  // 4) Pede senha
  $('#auth-login-email').textContent = AuthState.email;
  $('#auth-login-pwd').value = '';
  _authShowError_('login', '');
  _authShowPane_('login');
  setTimeout(() => { const i = $('#auth-login-pwd'); if (i) i.focus(); }, 50);
}

function _authComplete_() {
  AuthState.authenticated = true;
  _authSave_(AuthState.email);
  _authHideOverlay_();
  _authStartInactivityTimer_();

  // Primeiro boot do app (depois de autenticar)
  if (!AuthState.bootDone) {
    AuthState.bootDone = true;
    _appBoot_();
  }
}

async function _appBoot_() {
  try {
    const info = await run('getAppInfo');
    $('#user-email').textContent = info.user || AuthState.email || '';
  } catch (e) {
    $('#user-email').textContent = AuthState.email || '';
  }
  navigate();
}

function _authSetupHandlers_() {
  // Setup (primeira senha)
  $('#auth-setup-btn').onclick = async () => {
    const p1 = $('#auth-setup-pwd').value;
    const p2 = $('#auth-setup-pwd2').value;
    _authShowError_('setup', '');
    if (!p1 || p1.length < 4) { _authShowError_('setup', 'Senha precisa ter pelo menos 4 caracteres.'); return; }
    if (p1 !== p2) { _authShowError_('setup', 'As senhas não coincidem.'); return; }
    const btn = $('#auth-setup-btn');
    btn.disabled = true;
    try {
      const res = await run('setupFirstUser', p1);
      if (!res.ok) { _authShowError_('setup', res.error || 'Erro.'); btn.disabled = false; return; }
      _authComplete_();
    } catch (e) {
      _authShowError_('setup', e.message);
      btn.disabled = false;
    }
  };
  $('#auth-setup-pwd2').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('#auth-setup-btn').click();
  });

  // Login
  $('#auth-login-btn').onclick = async () => {
    const p = $('#auth-login-pwd').value;
    _authShowError_('login', '');
    if (!p) { _authShowError_('login', 'Digite sua senha.'); return; }
    const btn = $('#auth-login-btn');
    btn.disabled = true;
    try {
      const res = await run('login', p);
      if (!res.ok) {
        _authShowError_('login', res.error || 'Erro.');
        btn.disabled = false;
        $('#auth-login-pwd').select();
        return;
      }
      _authComplete_();
    } catch (e) {
      _authShowError_('login', e.message);
      btn.disabled = false;
    }
  };
  $('#auth-login-pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('#auth-login-btn').click();
  });

  // Locked (reentra com senha)
  $('#auth-locked-btn').onclick = async () => {
    const p = $('#auth-locked-pwd').value;
    _authShowError_('locked', '');
    if (!p) { _authShowError_('locked', 'Digite sua senha.'); return; }
    const btn = $('#auth-locked-btn');
    btn.disabled = true;
    try {
      const res = await run('login', p);
      if (!res.ok) {
        _authShowError_('locked', res.error || 'Erro.');
        btn.disabled = false;
        $('#auth-locked-pwd').select();
        return;
      }
      AuthState.authenticated = true;
      _authSave_(AuthState.email);
      _authResetInactivity_();
      _authHideOverlay_();
      btn.disabled = false;
    } catch (e) {
      _authShowError_('locked', e.message);
      btn.disabled = false;
    }
  };
  $('#auth-locked-pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('#auth-locked-btn').click();
  });

  // Acesso negado: tentar de novo (recarrega)
  $('#auth-denied-retry').onclick = () => location.reload();
}

document.addEventListener('DOMContentLoaded', async () => {
  updateMonthLabel();

  // Reaplica para sincronizar o ícone do botão
  applyTheme_(document.documentElement.getAttribute('data-theme') || 'light');

  $('#toggle-sidebar').onclick = () => {
    const sidebar = $('#sidebar');
    if (window.innerWidth <= 768) sidebar.classList.toggle('open');
    else sidebar.classList.toggle('collapsed');
  };
  $('#month-prev').onclick     = () => shiftMonth(-1);
  $('#month-next').onclick     = () => shiftMonth(1);
  $('#toggle-theme').onclick   = toggleTheme_;
  $('#btn-logout').onclick     = () => {
    if (confirm('Sair do FlowFinance? Você precisará digitar a senha de novo.')) _authLogout_();
  };

  // Cliques no menu lateral: interceptamos para não ser barrado pelo <base target="_top">.
  $$('.nav-item').forEach(n => {
    n.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(n.dataset.view);
      if (window.innerWidth <= 768) $('#sidebar').classList.remove('open');
    });
  });

  _authSetupHandlers_();
  _authBoot_();
});
</script>

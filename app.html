<script>
// ============================================================================
// FlowFinance — Frontend (SPA)
// ============================================================================

const State = {
  view: 'visao-geral',
  ano: new Date().getFullYear(),
  mes: new Date().getMonth() + 1,
  cadAtual: 'contas',
  metaAtual: 'orcamentos',
  cartaoAtual: null,
  filterLancs: { conta: '', categoria: '', status: '' },
  cache: {}
};

let _fluxoChart = null;
let _vgDonutChart = null;
let _vg6mChart = null;
const _charts = { categoria: null, centro: null, evolucao: null, evolCat: null };

// ===== Helpers =====

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// === Label amigável dos tipos de conta (mesmo nome no select e nas listas) ===
const CONTA_TIPO_LABEL = {
  corrente:     'Conta corrente',
  poupanca:     'Poupança',
  vale:         'Vale alimentação/refeição',
  dinheiro:     'Dinheiro / Carteira',
  investimento: 'Investimento',
  cartao:       'Cartão de crédito',
  emprestimo:   'Empréstimo / Dívida',
  outra:        'Outra'
};

const CONTA_TIPO_ORDEM = ['corrente','poupanca','vale','dinheiro','investimento','cartao','emprestimo','outra'];

// === Money input (modo "centavos": cada dígito digitado vai pra direita) ===

function _formatMoneyFromCents(centsStr) {
  centsStr = String(centsStr || '').replace(/\D/g, '');
  if (!centsStr) centsStr = '0';
  // Remove zeros à esquerda, mantém pelo menos 3 dígitos pra ter casa de centavo
  centsStr = centsStr.replace(/^0+/, '');
  while (centsStr.length < 3) centsStr = '0' + centsStr;
  const reais = centsStr.slice(0, -2);
  const cents = centsStr.slice(-2);
  const reaisGrouped = reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return reaisGrouped + ',' + cents;
}

function moneyInputValue_(el) {
  if (!el) return 0;
  const s = String(el.value || '');
  const neg = s.trim().indexOf('-') === 0;
  const raw = s.replace(/\D/g, '');
  if (!raw) return 0;
  return (neg ? -1 : 1) * (parseInt(raw, 10) / 100);
}

function setMoneyInputValue_(el, num) {
  if (!el) return;
  num = Number(num) || 0;
  const cents = Math.round(Math.abs(num) * 100);
  el.value = (num < 0 ? '-' : '') + _formatMoneyFromCents(String(cents));
}

function setupMoneyInput_(el) {
  if (!el || el.dataset.moneySetup) return;
  el.dataset.moneySetup = '1';
  el.type = 'text';
  el.setAttribute('inputmode', 'decimal');
  el.setAttribute('autocomplete', 'off');
  if (!el.placeholder) el.placeholder = '0,00';

  el.addEventListener('input', () => {
    const s = String(el.value || '');
    const neg = s.trim().indexOf('-') === 0;
    const raw = s.replace(/\D/g, '');
    el.value = (neg ? '-' : '') + _formatMoneyFromCents(raw);
    const len = el.value.length;
    try { el.setSelectionRange(len, len); } catch (e) {}
  });

  // Cursor sempre no fim ao focar
  el.addEventListener('focus', () => {
    const len = el.value.length;
    setTimeout(() => { try { el.setSelectionRange(len, len); } catch (e) {} }, 0);
  });
}

function fmtBRL(v) {
  return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function fmtDate(s) {
  if (!s) return '';
  const str = String(s);
  const d = new Date(str.length === 10 ? str + 'T00:00:00' : str);
  if (isNaN(d.getTime())) return str;
  return d.toLocaleDateString('pt-BR');
}

function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dd;
}

function monthLabel(ano, mes) {
  const names = ['janeiro','fevereiro','março','abril','maio','junho',
                 'julho','agosto','setembro','outubro','novembro','dezembro'];
  return names[mes - 1] + ' ' + ano;
}

let _loaderCount = 0;
function showLoader(on) {
  if (on) _loaderCount++;
  else _loaderCount = Math.max(0, _loaderCount - 1);
  const el = $('#loader');
  if (el) el.classList.toggle('hidden', _loaderCount === 0);
}

/**
 * Trava botões durante uma operação assíncrona. Cada botão cujo id contém "save"
 * ganha um spinner + "Salvando...". Retorna função pra liberar.
 */
function lockSaveButtons_() {
  const ids = Array.prototype.slice.call(arguments);
  const btns = ids.map(s => $(s)).filter(Boolean);
  const orig = btns.map(b => ({ html: b.innerHTML, disabled: b.disabled }));
  btns.forEach(b => {
    b.disabled = true;
    if (/save|fechar/i.test(b.id)) {
      b.innerHTML = '<span class="spinner"></span>Salvando...';
    }
  });
  return () => {
    btns.forEach((b, i) => {
      b.disabled = orig[i].disabled;
      b.innerHTML = orig[i].html;
    });
  };
}

let _toastTimer = null;
function toast(msg, isError) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.remove('hidden');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

/**
 * Wrapper de google.script.run que retorna Promise.
 * Em ambiente de preview (sem google.script), faz um stub que rejeita educadamente.
 */
function run(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      return reject(new Error('Ambiente offline: execute dentro do Apps Script Web App.'));
    }
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error((err && err.message) || String(err))));
    if (typeof runner[name] !== 'function') {
      return reject(new Error(
        'Função "' + name + '" não existe no servidor. ' +
        'Verifique se o arquivo .gs correspondente foi enviado (clasp push) e recarregue a página.'
      ));
    }
    runner[name].apply(runner, args);
  });
}

async function loadAux(force) {
  if (!force && State.cache.contas && State.cache.categorias && State.cache.centros && State.cache.cartoes && State.cache.recorrencias && State.cache.projetos && State.cache.regras) {
    return State.cache;
  }
  const [contas, categorias, centros, cartoes, recorrencias, projetos, regras] = await Promise.all([
    run('listContas'),
    run('listCategorias'),
    run('listCentros'),
    run('listCartoes'),
    run('listRecorrencias'),
    run('listProjetos'),
    run('listRegras')
  ]);
  State.cache.contas = contas;
  State.cache.categorias = categorias;
  State.cache.centros = centros;
  State.cache.cartoes = cartoes;
  State.cache.recorrencias = recorrencias;
  State.cache.projetos = projetos;
  State.cache.regras = regras;
  return State.cache;
}

function clearAuxCache() {
  delete State.cache.contas;
  delete State.cache.categorias;
  delete State.cache.centros;
  delete State.cache.cartoes;
  delete State.cache.recorrencias;
  delete State.cache.projetos;
  delete State.cache.regras;
}

function nameOf(list, id, fallback) {
  if (!id) return fallback || '—';
  const item = (list || []).find(x => String(x.id) === String(id));
  return item ? item.nome : (fallback || id);
}

// ============================================================================
// Router
// ============================================================================

const Views = {
  'visao-geral': { title: 'Visão geral',   tpl: 'tpl-visao-geral', init: initVisaoGeral,  monthAware: true },
  'lancamentos': { title: 'Movimentações', tpl: 'tpl-lancamentos', init: initLancamentos, monthAware: true },
  'cartoes':     { title: 'Cartões',       tpl: 'tpl-cartoes',     init: initCartoes,     monthAware: false },
  'patrimonio':  { title: 'Patrimônio',    tpl: 'tpl-patrimonio',  init: initPatrimonio,  monthAware: false },
  'metas':       { title: 'Metas',         tpl: 'tpl-metas',       init: initMetas,       monthAware: true },
  'relatorios':  { title: 'Relatórios',    tpl: 'tpl-relatorios',  init: initRelatorios,  monthAware: true },
  'importar':    { title: 'Importar',      tpl: 'tpl-importar',    init: initImportar,    monthAware: false },
  'fechamento':    { title: 'Fechamento',    tpl: 'tpl-fechamento',    init: initFechamento,    monthAware: false },
  'cadastros':     { title: 'Cadastros',     tpl: 'tpl-cadastros',     init: initCadastros,     monthAware: false },
  'configuracoes': { title: 'Configurações', tpl: 'tpl-configuracoes', init: initConfiguracoes, monthAware: false }
};

function navigate(viewName) {
  const requested = viewName || (location.hash || '#visao-geral').slice(1);
  const key = Views[requested] ? requested : 'visao-geral';
  const view = Views[key];
  State.view = key;

  const tpl = document.getElementById(view.tpl);
  const container = $('#view-container');
  container.innerHTML = '';
  container.appendChild(tpl.content.cloneNode(true));

  $('#page-title').textContent = view.title;
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === key));

  // Esconde controles de mês em telas que não dependem de mês
  $('#month-prev').classList.toggle('hidden', !view.monthAware);
  $('#month-next').classList.toggle('hidden', !view.monthAware);
  $('#month-label').classList.toggle('hidden', !view.monthAware);

  view.init();
}

function updateMonthLabel() {
  $('#month-label').textContent = monthLabel(State.ano, State.mes);
}

function shiftMonth(delta) {
  State.mes += delta;
  while (State.mes < 1)  { State.mes += 12; State.ano--; }
  while (State.mes > 12) { State.mes -= 12; State.ano++; }
  updateMonthLabel();
  if (Views[State.view] && Views[State.view].monthAware) {
    Views[State.view].init();
  }
}

function mesNome(m) {
  return ['janeiro','fevereiro','março','abril','maio','junho',
          'julho','agosto','setembro','outubro','novembro','dezembro'][m - 1];
}

// ============================================================================
// Visão Geral
// ============================================================================

const _vgFiltro = { contas: null, cartoes: null };
const _vgState  = { aba: 'mensal', anoAnual: new Date().getFullYear() };

async function initVisaoGeral() {
  showLoader(true);
  try {
    await loadAux();
    if (_vgFiltro.contas === null) {
      _vgFiltro.contas = new Set((State.cache.contas || []).map(c => c.id));
    }
    if (_vgFiltro.cartoes === null) {
      _vgFiltro.cartoes = new Set((State.cache.cartoes || []).map(c => c.id));
    }
    const allCb = $('#vg-conta-all');
    if (allCb) allCb.onchange = (e) => {
      if (e.target.checked) {
        _vgFiltro.contas  = new Set((State.cache.contas  || []).map(c => c.id));
        _vgFiltro.cartoes = new Set((State.cache.cartoes || []).map(c => c.id));
      } else {
        _vgFiltro.contas  = new Set();
        _vgFiltro.cartoes = new Set();
      }
      refreshVG_();
    };

    // Tabs Mensal/Anual
    $$('[data-vg]').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.vg === _vgState.aba);
      tab.onclick = () => switchVGTab_(tab.dataset.vg);
    });
    $$('[data-vg-pane]').forEach(p => {
      p.classList.toggle('hidden', p.dataset.vgPane !== _vgState.aba);
    });

    // Navegação ano na aba Anual
    if (!_vgState.anoAnual) _vgState.anoAnual = State.ano;
    const labelEl = $('#vg-ano-label');
    if (labelEl) labelEl.textContent = _vgState.anoAnual;
    const anoPrev = $('#vg-ano-prev');
    const anoNext = $('#vg-ano-next');
    if (anoPrev) anoPrev.onclick = () => { _vgState.anoAnual--; refreshVGAnual_(); };
    if (anoNext) anoNext.onclick = () => { _vgState.anoAnual++; refreshVGAnual_(); };

    await refreshVG_();
    if (_vgState.aba === 'anual') await refreshVGAnual_();
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function switchVGTab_(aba) {
  _vgState.aba = aba;
  $$('[data-vg]').forEach(t => t.classList.toggle('active', t.dataset.vg === aba));
  $$('[data-vg-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.vgPane !== aba));
  if (aba === 'anual') refreshVGAnual_();
}

async function refreshVG_() {
  const contasArr  = Array.from(_vgFiltro.contas  || []);
  const cartoesArr = Array.from(_vgFiltro.cartoes || []);
  const statusAll = ['pendente','agendado','confirmado','conciliado'];
  const [view, fluxo, extras] = await Promise.all([
    run('getMovimentacoesView', State.ano, State.mes, contasArr, statusAll, cartoesArr),
    run('getFluxoCaixa', State.ano, State.mes, contasArr),
    run('getVisaoGeralExtras', State.ano, State.mes, contasArr, cartoesArr)
  ]);
  renderSaldos(view.saldos_contas, view.saldos_cartoes);
  renderResumo({
    receitas: view.resumo.receitas,
    despesas: view.resumo.despesas,
    saldo:    view.resumo.resultado,
    quantidade: view.resumo.quantidade
  });
  renderFluxoChart(fluxo);
  renderVgEconomia_(extras.economia);
  renderVgComparativo_(extras.comparativo);
  renderVgOrcamentosAlerta_(extras.orcamentos_alerta);
  renderVgProximas_(extras.proximas_vencer);
  renderVgTopCategorias_(extras.top_categorias);
  renderVgDonut_(extras.despesas_por_categoria);
  renderVg6m_(extras.serie_6m);
  renderVgHeatmap_(extras.heatmap);
}

function renderVgEconomia_(e) {
  if (!e) return;
  const el = $('#vg-economia-pct');
  const desc = $('#vg-economia-desc');
  if (!el || !desc) return;
  if (e.percent === null) {
    el.textContent = '—';
    el.classList.remove('positive', 'negative');
    desc.textContent = 'Sem receitas no mês.';
    return;
  }
  const pct = e.percent;
  el.textContent = pct.toFixed(1) + '%';
  el.classList.toggle('positive', pct >= 0);
  el.classList.toggle('negative', pct < 0);
  desc.textContent = pct >= 0
    ? 'Você guardou ' + fmtBRL(e.resultado) + ' do que entrou.'
    : 'Gastou mais que entrou: ' + fmtBRL(Math.abs(e.resultado)) + '.';
}

function renderVgComparativo_(c) {
  if (!c) return;
  const fmt = (v) => {
    if (v === null || v === undefined) return '<span class="muted">—</span>';
    const arrow = v > 0 ? '↑' : (v < 0 ? '↓' : '·');
    const cls   = v > 0 ? 'vg-cmp-up' : (v < 0 ? 'vg-cmp-down' : 'vg-cmp-flat');
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toFixed(1) + '%</span>';
  };
  // Para despesas, mais é pior — inverte cor
  const fmtDes = (v) => {
    if (v === null || v === undefined) return '<span class="muted">—</span>';
    const arrow = v > 0 ? '↑' : (v < 0 ? '↓' : '·');
    const cls   = v > 0 ? 'vg-cmp-down' : (v < 0 ? 'vg-cmp-up' : 'vg-cmp-flat');
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toFixed(1) + '%</span>';
  };
  $('#vg-cmp-rec').innerHTML = fmt(c.receitas.variacao);
  $('#vg-cmp-des').innerHTML = fmtDes(c.despesas.variacao);
  $('#vg-cmp-res').innerHTML = fmt(c.resultado.variacao);
}

function renderVgOrcamentosAlerta_(o) {
  if (!o) return;
  const ok = o.total - o.no_limite - o.estourados;
  $('#vg-orc-ok').textContent  = ok;
  $('#vg-orc-lim').textContent = o.no_limite;
  $('#vg-orc-est').textContent = o.estourados;
}

function renderVgProximas_(lista) {
  const body = $('#vg-proximas-body');
  const empty = $('#vg-proximas-empty');
  if (!body) return;
  body.innerHTML = '';
  if (!lista || lista.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  lista.forEach(l => {
    const dotColor = statusColor_ ? statusColor_(l.status) : '#999';
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + fmtDateBR_(l.data) + '</td>' +
      '<td>' + escapeHtml(l.descricao) + '</td>' +
      '<td>' + escapeHtml(l.categoria_nome || '—') + '</td>' +
      '<td><span class="lanc-status-dot" style="background:' + dotColor + '"></span> ' + escapeHtml(l.status) + '</td>' +
      '<td class="right negative-val">' + fmtBRL(l.valor) + '</td>';
    body.appendChild(tr);
  });
}

function renderVgTopCategorias_(arr) {
  const cont = $('#vg-top-cat');
  const empty = $('#vg-top-cat-empty');
  if (!cont) return;
  cont.innerHTML = '';
  if (!arr || arr.length === 0) {
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  arr.forEach(c => {
    const row = document.createElement('div');
    row.className = 'vg-top-cat-row';
    row.innerHTML =
      '<div>' +
        '<div class="vg-top-cat-name">' + escapeHtml(c.nome) + '</div>' +
        '<div class="vg-top-cat-pct">' + c.percent.toFixed(1) + '% das despesas</div>' +
      '</div>' +
      '<div class="vg-top-cat-val negative-val">' + fmtBRL(c.total) + '</div>' +
      '<div class="vg-top-cat-bar"><div style="width:' + Math.min(100, c.percent) + '%"></div></div>';
    cont.appendChild(row);
  });
}

function renderVgDonut_(arr) {
  const canvas = $('#vg-donut-chart');
  const empty = $('#vg-donut-empty');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_vgDonutChart) { _vgDonutChart.destroy(); _vgDonutChart = null; }

  if (!arr || arr.length === 0 || arr.every(c => !c.total)) {
    if (empty) empty.classList.remove('hidden');
    return;
  }
  if (empty) empty.classList.add('hidden');

  // Pega top 8 + agrupa o resto como "Outras"
  const ordenado = arr.slice().sort((a, b) => b.total - a.total);
  const top = ordenado.slice(0, 8);
  const outras = ordenado.slice(8).reduce((s, c) => s + c.total, 0);
  const labels = top.map(c => c.nome).concat(outras > 0 ? ['Outras'] : []);
  const data   = top.map(c => c.total).concat(outras > 0 ? [outras] : []);

  const palette = ['#00c896','#e53935','#4285f4','#f1c40f','#9c27b0','#ff9800','#03a9f4','#e91e63','#999'];

  _vgDonutChart = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{ data: data, backgroundColor: palette.slice(0, labels.length), borderWidth: 0 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: ctx => ctx.label + ': ' + fmtBRL(ctx.raw)
          }
        }
      }
    }
  });
}

function renderVg6m_(serie) {
  const canvas = $('#vg-6m-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_vg6mChart) { _vg6mChart.destroy(); _vg6mChart = null; }
  if (!serie || serie.length === 0) return;

  const labels = serie.map(s => s.label);
  const rec = serie.map(s => s.receitas);
  const des = serie.map(s => s.despesas);
  const res = serie.map(s => s.resultado);

  _vg6mChart = new Chart(canvas.getContext('2d'), {
    data: {
      labels: labels,
      datasets: [
        { type: 'bar', label: 'Receitas', data: rec, backgroundColor: 'rgba(0,200,150,0.7)', borderRadius: 4, order: 2 },
        { type: 'bar', label: 'Despesas', data: des, backgroundColor: 'rgba(229,57,53,0.7)', borderRadius: 4, order: 2 },
        { type: 'line', label: 'Resultado', data: res, borderColor: '#4285f4', borderWidth: 2.5, tension: 0.25, pointRadius: 3, fill: false, order: 1, yAxisID: 'y' }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtBRL(ctx.raw) } }
      },
      scales: {
        x: { stacked: false },
        y: { beginAtZero: true, ticks: { callback: v => fmtBRL(v) } }
      }
    }
  });
}

async function refreshVGAnual_() {
  const labelEl = $('#vg-ano-label');
  if (labelEl) labelEl.textContent = _vgState.anoAnual;
  const contasArr  = Array.from(_vgFiltro.contas  || []);
  const cartoesArr = Array.from(_vgFiltro.cartoes || []);
  showLoader(true);
  try {
    const dados = await run('getVisaoGeralAnualExtras', _vgState.anoAnual, contasArr, cartoesArr);
    renderVgAnualTotais_(dados.totais);
    renderVgAnualComparativo_(dados.comparativo);
    renderVgAnualMedia_(dados.media_mensal);
    renderVgAnualTopCat_(dados.top_categorias);
    renderVgAnualHeatmap_(dados.heatmap, _vgState.anoAnual);
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function renderVgAnualTotais_(t) {
  if (!t) return;
  const setColor = (id, val, cls) => {
    const el = $('#' + id);
    if (!el) return;
    el.textContent = fmtBRL(val);
    el.classList.remove('positive', 'negative');
    if (cls) el.classList.add(cls);
    else if (val > 0) el.classList.add('positive');
    else if (val < 0) el.classList.add('negative');
  };
  setColor('vga-receitas', t.receitas, 'positive');
  setColor('vga-despesas', t.despesas, 'negative');
  setColor('vga-resultado', t.resultado);

  const pctEl = $('#vga-pct');
  const pctDesc = $('#vga-pct-desc');
  if (t.percent === null || t.percent === undefined) {
    pctEl.textContent = '—';
    pctEl.classList.remove('positive', 'negative');
    pctDesc.textContent = 'Sem receitas no ano.';
  } else {
    pctEl.textContent = t.percent.toFixed(1) + '%';
    pctEl.classList.toggle('positive', t.percent >= 0);
    pctEl.classList.toggle('negative', t.percent < 0);
    pctDesc.textContent = t.percent >= 0
      ? 'Você guardou ' + fmtBRL(t.resultado) + ' no ano.'
      : 'Gastou mais que entrou: ' + fmtBRL(Math.abs(t.resultado));
  }
}

function renderVgAnualComparativo_(c) {
  if (!c) return;
  const fmt = (v) => {
    if (v === null || v === undefined) return '<span class="muted">—</span>';
    const arrow = v > 0 ? '↑' : (v < 0 ? '↓' : '·');
    const cls = v > 0 ? 'vg-cmp-up' : (v < 0 ? 'vg-cmp-down' : 'vg-cmp-flat');
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toFixed(1) + '%</span>';
  };
  const fmtDes = (v) => {
    if (v === null || v === undefined) return '<span class="muted">—</span>';
    const arrow = v > 0 ? '↑' : (v < 0 ? '↓' : '·');
    const cls = v > 0 ? 'vg-cmp-down' : (v < 0 ? 'vg-cmp-up' : 'vg-cmp-flat');
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toFixed(1) + '%</span>';
  };
  $('#vga-cmp-rec').innerHTML = fmt(c.receitas.variacao);
  $('#vga-cmp-des').innerHTML = fmtDes(c.despesas.variacao);
  $('#vga-cmp-res').innerHTML = fmt(c.resultado.variacao);
}

function renderVgAnualHeatmap_(dias, ano) {
  const cont = $('#vga-heatmap');
  const monthsCont = $('#vga-heatmap-months');
  if (!cont) return;
  cont.innerHTML = '';
  if (monthsCont) monthsCont.innerHTML = '';
  if (!dias || dias.length === 0) return;

  // Início: alinhar a coluna 0 com o dia da semana do 1º de jan
  // Estilo GitHub: 7 linhas (dom-sáb) × 53 colunas (semanas). Grid CSS preenche por COLUNA.
  // Adicionamos células invisíveis no início pra empurrar 1º jan para a linha correta.
  const primeiroDow = dias[0].dia_semana; // 0=dom
  for (let i = 0; i < primeiroDow; i++) {
    const blank = document.createElement('div');
    blank.style.visibility = 'hidden';
    blank.className = 'ha-cell';
    cont.appendChild(blank);
  }
  dias.forEach(d => {
    const cell = document.createElement('div');
    let bucket = 0;
    if (d.intensidade > 0)    bucket = 1;
    if (d.intensidade > 0.25) bucket = 2;
    if (d.intensidade > 0.50) bucket = 3;
    if (d.intensidade > 0.80) bucket = 4;
    cell.className = 'ha-cell hl-' + bucket;
    const dataBR = fmtDateBR_(d.data);
    cell.title = dataBR + (d.gasto > 0 ? ' — ' + fmtBRL(d.gasto) : ' — sem gastos');
    cont.appendChild(cell);
  });

  // Cabeçalhos de meses
  if (monthsCont) {
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    meses.forEach(m => {
      const span = document.createElement('span');
      span.textContent = m;
      monthsCont.appendChild(span);
    });
  }
}

function renderVgHeatmap_(dias) {
  const cont = $('#vg-heatmap');
  if (!cont) return;
  cont.innerHTML = '';
  if (!dias || dias.length === 0) return;

  // Modo despesa: usa paleta vermelha
  cont.classList.add('heat-despesa');

  // Cabeçalho dos dias da semana (dom...sáb)
  const diasSemana = ['D','S','T','Q','Q','S','S'];
  diasSemana.forEach(d => {
    const head = document.createElement('div');
    head.className = 'hl-head';
    head.textContent = d;
    cont.appendChild(head);
  });

  // Preenche os dias vazios do início (até o primeiro dia da semana do mês)

  for (let i = 0; i < primeiro.dia_semana; i++) {
    const blank = document.createElement('div');
    blank.className = 'hl-cell hl-0';
    blank.style.visibility = 'hidden';
    cont.appendChild(blank);
  }
  dias.forEach(d => {
    const cell = document.createElement('div');
    let bucket = 0;
    if (d.intensidade > 0)    bucket = 1;
    if (d.intensidade > 0.25) bucket = 2;
    if (d.intensidade > 0.50) bucket = 3;
    if (d.intensidade > 0.80) bucket = 4;
    cell.className = 'hl-cell hl-' + bucket;
    cell.title = fmtDateBR_(d.data) + ' — ' + fmtBRL(d.gasto);

    cont.appendChild(cell);
  });
}

function renderSaldos(saldosContas, saldosCartoes) {
  const cont = $('#saldos-items');
  const empty = $('#saldos-empty');
  if (!cont) return;
  cont.innerHTML = '';
  saldosCartoes = saldosCartoes || [];

  // Merge TODAS as contas + cartões (não só as filtradas) pra exibir todos com checkbox
  const allContas  = State.cache.contas  || [];
  const allCartoes = State.cache.cartoes || [];
  const saldoMap = {};
  (saldosContas  || []).forEach(s => { saldoMap['c:' + s.id] = s; });
  (saldosCartoes || []).forEach(s => { saldoMap['k:' + s.id] = s; });

  const itens = []
    .concat(allContas.map(c => ({ kind: 'conta',  tipo: c.tipo || 'outra', data: c })))
    .concat(allCartoes.map(c => ({ kind: 'cartao', tipo: 'cartao',          data: c })))
    .sort((a, b) => {
      const ia = CONTA_TIPO_ORDEM.indexOf(a.tipo);
      const ib = CONTA_TIPO_ORDEM.indexOf(b.tipo);
      const ta = ia === -1 ? 99 : ia;
      const tb = ib === -1 ? 99 : ib;
      if (ta !== tb) return ta - tb;
      return String(a.data.nome || '').localeCompare(String(b.data.nome || ''), 'pt-BR', { numeric: true });
    });

  empty.classList.toggle('hidden', itens.length > 0);

  let totC = 0, totP = 0;
  let currentTipo = null;
  itens.forEach(it => {
    if (it.tipo !== currentTipo) {
      currentTipo = it.tipo;
      const header = document.createElement('div');
      header.className = 'mov-conta-group';
      header.textContent = CONTA_TIPO_LABEL[it.tipo] || it.tipo;
      cont.appendChild(header);
    }

    const c = it.data;
    const isCartao = it.kind === 'cartao';
    const filtroSet = isCartao ? _vgFiltro.cartoes : _vgFiltro.contas;
    const sel = filtroSet.has(c.id);
    const s = saldoMap[(isCartao ? 'k:' : 'c:') + c.id] || { confirmado: 0, projetado: 0 };
    const cVal = Number(s.confirmado) || 0;
    const pVal = Number(s.projetado)  || 0;
    if (sel) { totC += cVal; totP += pVal; }

    const cClass = cVal > 0 ? 'positive-val' : (cVal < 0 ? 'negative-val' : '');
    const pClass = pVal > 0 ? 'positive-val' : (pVal < 0 ? 'negative-val' : '');
    const moedaTag = (!isCartao && c.moeda)
      ? ' <span class="moeda-tag">' + escapeHtml(c.moeda) + '</span>' : '';
    const item = document.createElement('div');
    item.className = 'mov-conta-item';
    item.innerHTML =
      '<input type="checkbox" data-id="' + escapeHtml(c.id) + '" data-kind="' + it.kind + '"' + (sel ? ' checked' : '') + '>' +
      '<div class="conta-name" title="' + escapeHtml(c.nome) + '">' +
        contaIconHtml(c, 16) + '<span>' + escapeHtml(c.nome) + '</span>' + moedaTag +
      '</div>' +
      '<div class="right ' + cClass + '">' + fmtBRL(cVal) + '</div>' +
      '<div class="right ' + pClass + '">' + fmtBRL(pVal) + '</div>';
    cont.appendChild(item);
  });

  const totConfEl = $('#total-confirmado');
  const totProjEl = $('#total-projetado');
  totConfEl.textContent = fmtBRL(totC);
  totProjEl.textContent = fmtBRL(totP);
  totConfEl.classList.remove('positive-val', 'negative-val');
  totProjEl.classList.remove('positive-val', 'negative-val');
  if (totC > 0) totConfEl.classList.add('positive-val');
  else if (totC < 0) totConfEl.classList.add('negative-val');
  if (totP > 0) totProjEl.classList.add('positive-val');
  else if (totP < 0) totProjEl.classList.add('negative-val');

  const totalItens = allContas.length + allCartoes.length;
  const allCb = $('#vg-conta-all');
  if (allCb) allCb.checked = totalItens > 0 &&
    (_vgFiltro.contas.size + _vgFiltro.cartoes.size === totalItens);

  cont.onclick = (e) => {
    const cb = e.target.closest('input[type="checkbox"]');
    const row = e.target.closest('.mov-conta-item');
    if (!cb && !row) return;
    let cbReal = cb;
    if (!cbReal && row) {
      cbReal = row.querySelector('input[type="checkbox"]');
      cbReal.checked = !cbReal.checked;
    }
    const id = cbReal.dataset.id;
    const kind = cbReal.dataset.kind;
    const set = (kind === 'cartao') ? _vgFiltro.cartoes : _vgFiltro.contas;
    if (cbReal.checked) set.add(id);
    else set.delete(id);
    refreshVG_();
  };
}

async function initCartoes() {
  showLoader(true);
  try {
    await loadAux();
    const cartoes = (State.cache.cartoes || []).filter(c =>
      c.ativo === true || c.ativo === 'true' || c.ativo === '' || c.ativo === undefined
    );

    const selector = $('#cartao-selector');
    const empty = $('#cartao-empty');
    const detalhes = $('#cartao-detalhes');
    const lancsCard = $('#cartao-lancs-card');

    if (!cartoes.length) {
      empty.classList.remove('hidden');
      detalhes.classList.add('hidden');
      lancsCard.style.display = 'none';
      selector.innerHTML = '';
      return;
    }

    empty.classList.add('hidden');
    detalhes.classList.remove('hidden');
    lancsCard.style.display = '';

    selector.innerHTML = cartoes.map(c =>
      '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.nome) + '</option>'
    ).join('');

    if (!State.cartaoAtual || !cartoes.find(c => c.id === State.cartaoAtual)) {
      State.cartaoAtual = cartoes[0].id;
    }
    selector.value = State.cartaoAtual;

    // Fatura sendo vista (mês de vencimento). Inicializa no mês atual se ainda não definido.
    if (!State.faturaAno || !State.faturaMes) {
      const hoje = new Date();
      State.faturaAno = hoje.getFullYear();
      State.faturaMes = hoje.getMonth() + 1;
    }

    selector.onchange = () => {
      State.cartaoAtual = selector.value;
      renderFatura();
    };
    $('#fatura-prev').onclick = () => { shiftFatura_(-1); };
    $('#fatura-next').onclick = () => { shiftFatura_(1); };

    // Salto direto pra uma fatura (mês/ano) via seletor nativo
    const monthPicker = $('#fatura-month-picker');
    const btnPick = $('#fatura-nav-pick');
    if (btnPick && monthPicker) {
      btnPick.onclick = () => {
        monthPicker.value = String(State.faturaAno) + '-' + String(State.faturaMes).padStart(2, '0');
        monthPicker.classList.remove('hidden'); // showPicker() não funciona em display:none
        try { monthPicker.showPicker(); } catch (e) { monthPicker.focus(); }
      };
      monthPicker.onchange = () => {
        const m = String(monthPicker.value).match(/^(\d{4})-(\d{2})$/);
        if (m) { State.faturaAno = Number(m[1]); State.faturaMes = Number(m[2]); renderFatura(); }
        monthPicker.classList.add('hidden');
      };
      monthPicker.onblur = () => monthPicker.classList.add('hidden');
    }

    $('#btn-pagar-fatura').onclick = handlePagarFatura;
    $('#btn-novo-lanc-cartao').onclick = () => {
      // Abre o modal novo (despesa) e pré-seleciona este cartão + a competência desta fatura
      openLancamentoModal(null, 'despesa');
      if (_lfOndeCombo) _lfOndeCombo.setValue('k:' + State.cartaoAtual);
      const comp = String(State.faturaAno) + '-' + String(State.faturaMes).padStart(2, '0');
      _lancModal._faturaTocada = true;
      const fc = $('#lf-fatura-comp'); if (fc) fc.value = comp;
      _atualizarFaturaComp_();
    };

    await renderFatura();
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

function shiftFatura_(delta) {
  let m = State.faturaMes + delta;
  let a = State.faturaAno;
  while (m > 12) { m -= 12; a++; }
  while (m < 1)  { m += 12; a--; }
  State.faturaMes = m;
  State.faturaAno = a;
  renderFatura();
}


async function renderFatura() {
  if (!State.cartaoAtual) return;
  showLoader(true);
  try {
    const [fatura, resumo, painel] = await Promise.all([
      run('getFatura', State.cartaoAtual, State.faturaAno, State.faturaMes),
      run('getCartaoResumo', State.cartaoAtual),
      run('getCartaoPainel', State.cartaoAtual, State.faturaAno, State.faturaMes, 3, 6)
    ]);
    renderCartaoPainel_(painel);

    // Navegador de fatura: label + período do ciclo + badge de status
    const venc = fatura.ciclo.vencimento;
    $('#fatura-nav-label').textContent = 'Fatura vence ' + fmtDateBR_(venc);
    $('#fatura-nav-periodo').textContent =
      'compras de ' + fmtDateBR_(fatura.ciclo.inicio) + ' a ' + fmtDateBR_(fatura.ciclo.fim);
    const badge = $('#fatura-status-badge');
    if (badge) {
      const bmap = { aberta: ['Aberta','badge-aberta'], fechada: ['Fechada','badge-fechada'], paga: ['Paga','badge-paga'] };
      const b = bmap[fatura.status] || bmap.aberta;
      badge.className = 'fatura-badge ' + b[1];
      badge.textContent = b[0];
    }

    $('#fatura-fechamento').textContent = fmtDateBR_(fatura.ciclo.fim);
    $('#fatura-vencimento').textContent = fmtDateBR_(fatura.ciclo.vencimento);
    $('#fatura-total').textContent = fmtBRL(fatura.total);
    $('#fatura-total').classList.toggle('negative-val', fatura.total < 0);
    $('#fatura-total').classList.toggle('positive-val', fatura.total > 0);
    $('#fatura-limite').textContent =
      fmtBRL(resumo.disponivel) + ' / ' + fmtBRL(resumo.limite);

    // Botão pagar: desabilita/renomeia se já paga ou sem valor
    const btnPagar = $('#btn-pagar-fatura');
    if (btnPagar) {
      if (fatura.status === 'paga') {
        btnPagar.innerHTML = '<span class="material-icons-outlined">check_circle</span> Fatura paga';
        btnPagar.disabled = true;
      } else {
        btnPagar.innerHTML = '<span class="material-icons-outlined">payments</span> Pagar fatura';
        btnPagar.disabled = Math.abs(fatura.total) < 0.01;
      }
    }

    const body = $('#fatura-lancs-body');
    const empty = $('#fatura-lancs-empty');
    body.innerHTML = '';
    empty.classList.toggle('hidden', fatura.lancamentos.length > 0);
    State._faturaSelecionados = new Set();

    fatura.lancamentos.forEach(l => {
      const valor = Number(l.valor) || 0;
      const parc = (l.parcela_atual && l.parcela_total)
        ? (l.parcela_atual + '/' + l.parcela_total) : '—';
      const manual = l.fatura_competencia
        ? ' <span class="fatura-manual-tag" title="Competência ajustada manualmente">movido</span>' : '';
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="checkbox" class="fatura-check" data-id="' + escapeHtml(l.id) + '"></td>' +
        '<td>' + fmtDateBR_(l.data) + '</td>' +
        '<td>' + escapeHtml(l.descricao) + manual + '</td>' +
        '<td>' + escapeHtml(nameOf(State.cache.categorias, l.categoria, '—')) + '</td>' +
        '<td>' + parc + '</td>' +
        '<td class="right ' + (valor < 0 ? 'negative-val' : 'positive-val') + '">' + fmtBRL(valor) + '</td>' +
        '<td class="right fatura-mover">' +
          '<button class="icon-btn" data-act="mov-prev" data-id="' + escapeHtml(l.id) + '" title="Mover pra fatura anterior"><span class="material-icons-outlined">chevron_left</span></button>' +
          '<button class="icon-btn" data-act="mov-next" data-id="' + escapeHtml(l.id) + '" title="Mover pra próxima fatura"><span class="material-icons-outlined">chevron_right</span></button>' +
        '</td>' +
        '<td>' +
          '<div class="row-actions">' +
            '<button class="icon-btn" data-act="edit" data-id="' + escapeHtml(l.id) + '" title="Editar"><span class="material-icons-outlined">edit</span></button>' +
            '<button class="icon-btn" data-act="del" data-id="' + escapeHtml(l.id) + '" title="Excluir"><span class="material-icons-outlined">delete</span></button>' +
          '</div>' +
        '</td>';
      body.appendChild(tr);
    });

    // Seleção múltipla + barra de ação em massa
    _setupFaturaBulkBar_(fatura);
    _updateFaturaBulkBar_();
    const fatCheckAll = $('#fatura-check-all');
    if (fatCheckAll) {
      fatCheckAll.checked = false; fatCheckAll.indeterminate = false;
      fatCheckAll.onchange = () => {
        const checked = fatCheckAll.checked;
        State._faturaSelecionados = checked
          ? new Set(fatura.lancamentos.map(l => String(l.id)))
          : new Set();
        $$('.fatura-check', body).forEach(cb => {
          cb.checked = checked;
          const tr = cb.closest('tr'); if (tr) tr.classList.toggle('lanc-row-selecionada', checked);
        });
        _updateFaturaBulkBar_();
      };
    }
    $$('.fatura-check', body).forEach(cb => {
      cb.onchange = () => {
        const id = String(cb.dataset.id);
        if (cb.checked) State._faturaSelecionados.add(id);
        else State._faturaSelecionados.delete(id);
        const tr = cb.closest('tr'); if (tr) tr.classList.toggle('lanc-row-selecionada', cb.checked);
        const sel = State._faturaSelecionados.size;
        if (fatCheckAll) {
          fatCheckAll.checked = (sel === fatura.lancamentos.length && sel > 0);
          fatCheckAll.indeterminate = (sel > 0 && sel < fatura.lancamentos.length);
        }
        _updateFaturaBulkBar_();
      };
    });

    body.onclick = async (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const lanc = fatura.lancamentos.find(l => String(l.id) === String(id));
      try {
        if (act === 'edit') {
          openLancamentoModal(lanc);
          return;
        }
        if (act === 'mov-prev' || act === 'mov-next') {
          showLoader(true);
          const r = await run('moverFaturaCompetencia', id, act === 'mov-next' ? 1 : -1);
          toast('Movido para a fatura ' + r.competencia + '.');
          await renderFatura();
          return;
        }
        // excluir
        if (lanc && lanc.recorrencia_id) {
          const scope = await askSerieScope_('Excluir', id);
          if (!scope) return;
          showLoader(true);
          const r = await run('deleteLancamentoSerie', id, scope);
          toast(r.count + ' lançamento' + (r.count === 1 ? '' : 's') + ' excluído' + (r.count === 1 ? '' : 's') + '.');
        } else {
          if (!confirm('Excluir este lançamento?')) return;
          showLoader(true);
          await run('deleteLancamento', id);
          toast('Excluído');
        }
        await renderFatura();
      } catch (err) {
        toast(err.message, true);
      } finally {
        showLoader(false);
      }
    };
  } catch (e) {
    toast(e.message, true);
  } finally {
    showLoader(false);
  }
}

let _painelFaturasChart = null;

function renderCartaoPainel_(p) {
  if (!p) return;
  // Mini-cards
  const usadoPct = p.limite > 0 ? Math.min(100, (p.utilizado / p.limite) * 100) : 0;
  $('#painel-limite-val').textContent = p.limite > 0 ? usadoPct.toFixed(0) + '%' : '—';
  const fill = $('#painel-limite-fill');
  if (fill) {
    fill.style.width = usadoPct + '%';
    fill.className = usadoPct >= 90 ? 'limite-alto' : (usadoPct >= 70 ? 'limite-medio' : '');
  }
  $('#painel-limite-sub').textContent = p.limite > 0
    ? fmtBRL(p.utilizado) + ' de ' + fmtBRL(p.limite) + ' · livre ' + fmtBRL(p.disponivel)
    : 'sem limite cadastrado';

  $('#painel-devedor').textContent = fmtBRL(Math.abs(p.saldo_devedor));

  const fat = p.fatura_central;
  $('#painel-fatura-val').textContent = fat ? fmtBRL(fat.total) : 'R$ 0,00';
  $('#painel-fatura-sub').innerHTML = fat
    ? '<span class="fatura-badge badge-' + fat.status + '" style="font-size:9px">' + fat.status + '</span> · ' + fat.qtd + ' lanç.'
    : '—';

  $('#painel-futuro').textContent = fmtBRL(p.comprometido_futuro);

  // Gráfico de faturas (barras por mês)
  renderPainelFaturasChart_(p.serie || []);
}

function renderPainelFaturasChart_(serie) {
  const canvas = $('#painel-faturas-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_painelFaturasChart) { _painelFaturasChart.destroy(); _painelFaturasChart = null; }
  if (!serie.length) return;

  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const labels = serie.map(s => meses[s.mes - 1] + '/' + String(s.ano).slice(2));
  const dados  = serie.map(s => s.total);
  // Cores por status: paga (verde), atual (azul destaque), futura/aberta (laranja), fechada (cinza)
  const cores = serie.map(s => {
    if (s.central) return '#4285f4';
    if (s.status === 'paga') return 'rgba(0,163,124,0.55)';
    if (s.status === 'fechada') return 'rgba(108,117,125,0.5)';
    return 'rgba(230,126,34,0.6)'; // futura/aberta
  });

  _painelFaturasChart = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: dados, backgroundColor: cores, borderRadius: 4 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const s = serie[ctx.dataIndex];
              return fmtBRL(s.total) + ' · ' + s.qtd + ' lanç. · ' + s.status;
            }
          }
        }
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => fmtBRL(v) } } },
      onClick: (evt, els) => {
        if (!els || !els.length) return;
        const s = serie[els[0].index];
        if (s) { State.faturaAno = s.ano; State.faturaMes = s.mes; renderFatura(); }
      }
    }
  });
}

// ===== Ação em massa na aba Cartões (fatura) =====
function _updateFaturaBulkBar_() {
  const bar = $('#fatura-bulk-bar');
  if (!bar) return;
  const n = (State._faturaSelecionados || new Set()).size;
  bar.classList.toggle('hidden', n === 0);
  const cnt = $('#fatura-bulk-count');
  if (cnt) cnt.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  if (n > 0) _bulkCtxFatura_(); // fixa o contexto da ação em massa pra esta fatura
}

/** Competência (YYYY-MM) da fatura visível deslocada por delta meses. */
function _faturaCompShift_(delta) {
  let m = State.faturaMes + delta, a = State.faturaAno;
  while (m > 12) { m -= 12; a++; }
  while (m < 1)  { m += 12; a--; }
  return a + '-' + String(m).padStart(2, '0');
}

function _setupFaturaBulkBar_() {
  _setupBulkModalOnce_(); // garante o modal de categoria/centro mesmo indo direto pra Cartões
  // Handlers no template (re-clonado a cada navegação) → .onclick idempotente, religa sempre
  const statusSel = $('#fatura-bulk-status');
  if (statusSel) statusSel.onchange = async () => {
    const v = statusSel.value; statusSel.value = '';
    if (!v) return;
    _bulkCtxFatura_();
    await _aplicarBulk_({ status: v }, 'Status alterado');
  };
  const btnCat = $('#fatura-bulk-categoria');
  if (btnCat) btnCat.onclick = () => { _bulkCtxFatura_(); openBulkModal_('categoria'); };
  const btnPrev = $('#fatura-bulk-mov-prev');
  if (btnPrev) btnPrev.onclick = async () => { _bulkCtxFatura_(); await _aplicarBulk_({ fatura_competencia: _faturaCompShift_(-1) }, 'Movido pra fatura ' + _faturaCompShift_(-1)); };
  const btnNext = $('#fatura-bulk-mov-next');
  if (btnNext) btnNext.onclick = async () => { _bulkCtxFatura_(); await _aplicarBulk_({ fatura_competencia: _faturaCompShift_(1) }, 'Movido pra fatura ' + _faturaCompShift_(1)); };
  const btnDel = $('#fatura-bulk-del');
  if (btnDel) btnDel.onclick = async () => {
    const ids = Array.from(State._faturaSelecionados || []);
    if (ids.length === 0) return;
    if (!confirm('Excluir ' + ids.length + ' lançamento(s) selecionado(s) desta fatura? Não pode ser desfeito.')) return;
    showLoader(true);
    try {
      const r = await run('deleteLancamentosBatch', ids);
      toast(r.count + ' lançamento(s) excluído(s).');
      State._faturaSelecionados = new Set();
      await renderFatura();
    } catch (e) { toast(e.message, true); }
    finally { showLoader(false); }
  };
  const btnClear = $('#fatura-bulk-clear');
  if (btnClear) btnClear.onclick = () => {
    State._faturaSelecionados = new Set();
    $$('#fatura-lancs-body .fatura-check').forEach(cb => { cb.checked = false; });
    $$('#fatura-lancs-body tr.lanc-row-selecionada').forEach(tr => tr.classList.remove('lanc-row-selecionada'));
    const ca = $('#fatura-check-all'); if (ca) { ca.checked = false; ca.indeterminate = false; }
    _updateFaturaBulkBar_();
  };
}

  } finally {
    showLoader(false);

}

const _orcModal = { editando: null, tipo: 'categoria', setupDone: false };
let _ofCategoriaCombo = null;

function getOrcCategoriaOptions_() {
  // Inclui todas as categorias (receita + despesa), com hierarquia
  const allCats = State.cache.categorias || [];
  const cats = allCats.filter(c => c.tipo !== 'transferencia');
  const pais = cats.filter(c => !c.pai)
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  const filhosPorPai = {};
  cats.filter(c => c.pai).forEach(c => {
    (filhosPorPai[c.pai] = filhosPorPai[c.pai] || []).push(c);
  });
  const opts = [];
  pais.forEach(p => {
    const tipoTag = p.tipo === 'receita' ? ' (receita)' : ' (despesa)';
    opts.push({ value: p.id, label: p.nome + tipoTag, indent: false, searchText: p.nome });
    const filhos = (filhosPorPai[p.id] || [])
      .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    filhos.forEach(f => {
      opts.push({
        value: f.id, label: f.nome, indent: true,
        searchText: p.nome + ' ' + f.nome
      });
    });
  });
  return opts;
}

function setupOrcModalOnce_() {
  if (_orcModal.setupDone) return;
  _orcModal.setupDone = true;

  _ofCategoriaCombo = setupCombobox_('of-categoria', getOrcCategoriaOptions_);

  setupMoneyInput_($('#of-valor'));

  $$('#of-tipo-tabs .type-tab').forEach(t => {
    t.onclick = () => setOrcTipo_(t.dataset.tipo);
  });

  $('#orc-modal-close').onclick  = closeOrcModal_;
  $('#orc-modal-cancel').onclick = closeOrcModal_;
  $('#orc-modal-bg').onclick     = closeOrcModal_;
  $('#orc-modal-save').onclick   = saveOrcModal_;

  document.addEventListener('keydown', (e) => {
    const m = $('#orc-modal');
    if (!m || m.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeOrcModal_();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveOrcModal_();
  });
}

function setOrcTipo_(tipo) {
  _orcModal.tipo = tipo === 'centro' ? 'centro' : 'categoria';
  $$('#of-tipo-tabs .type-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tipo === _orcModal.tipo));
  $('#of-row-categoria').style.display = _orcModal.tipo === 'categoria' ? '' : 'none';
  $('#of-row-centro').style.display    = _orcModal.tipo === 'centro'    ? '' : 'none';
}

function closeOrcModal_() {
  $('#orc-modal').classList.add('hidden');
  _orcModal.editando = null;
}

function openOrcamentoModal(orc) {
  setupOrcModalOnce_();
  _orcModal.editando = orc || null;

  // Popula select de centro
  const centros = (State.cache.centros || []).map(c => ({ id: c.id, nome: c.nome }));
  fillSel_('#of-centro', centros, true);

  // Reset
  $('#of-nome').value = (orc && orc.nome) || '';
  setMoneyInputValue_($('#of-valor'), (orc && Number(orc.valor)) || 0);

  // data_inicio: mês corrente como default
  const hoje = new Date();
  const yymm = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
  $('#of-data-inicio').value = (orc && orc.data_inicio) ? String(orc.data_inicio).slice(0, 7) : yymm;
  $('#of-data-fim').value    = (orc && orc.data_fim)    ? String(orc.data_fim).slice(0, 7)    : '';
  $('#of-mostrar-restante').checked = orc ? !!(orc.mostrar_restante === true || orc.mostrar_restante === 'true' || orc.mostrar_restante === 'TRUE' || orc.mostrar_restante === 1) : false;

  const tipo = (orc && orc.tipo) || 'categoria';
  setOrcTipo_(tipo);

  // Pre-seleciona referência
  if (tipo === 'categoria') {
    _ofCategoriaCombo.refresh();
    _ofCategoriaCombo.setValue(orc ? orc.referencia : '');
    $('#of-centro').value = '';
  } else {
    $('#of-centro').value = orc ? orc.referencia : '';
    if (_ofCategoriaCombo) _ofCategoriaCombo.setValue('');
  }

  $('#orc-modal-title').textContent = orc ? 'Editar orçamento' : 'Novo orçamento';
  $('#orc-modal').classList.remove('hidden');
  setTimeout(() => {
    const focusEl = _orcModal.tipo === 'categoria' ? $('#of-categoria-display') : $('#of-centro');
    if (focusEl) focusEl.focus();
  }, 50);
}

async function saveOrcModal_() {
  const tipo = _orcModal.tipo;
  const referencia = tipo === 'categoria'
    ? ($('#of-categoria').value || '')
    : ($('#of-centro').value    || '');
  const valor = moneyInputValue_($('#of-valor'));
  const dataInicio = $('#of-data-inicio').value;
  const dataFim    = $('#of-data-fim').value;

  if (!referencia) {
    return toast(tipo === 'categoria' ? 'Selecione uma categoria.' : 'Selecione um centro.', true);
  }
  if (!valor || valor <= 0) return toast('Informe o valor mensal.', true);
  if (!dataInicio)          return toast('Informe a data de início.', true);
  if (dataFim && dataFim < dataInicio) return toast('Data fim deve ser depois do início.', true);

  const payload = {
    nome: $('#of-nome').value.trim(),
    tipo: tipo,
    referencia: referencia,
    valor: valor,
    periodo: 'mensal',
    data_inicio: dataInicio,
    data_fim: dataFim || '',
    mostrar_restante: $('#of-mostrar-restante').checked
  };
  if (_orcModal.editando && _orcModal.editando.id) payload.id = _orcModal.editando.id;

  const unlock = lockSaveButtons_('#orc-modal-save', '#orc-modal-cancel', '#orc-modal-close');
  showLoader(true);
  try {
    await run('saveOrcamento', payload);
    toast('Orçamento salvo.');
    closeOrcModal_();
    renderOrcamentos().catch(err => toast(err.message, true));
  } catch (e) {
    toast(e.message, true);
  } finally {
    unlock();
    showLoader(false);
  }
}

async function initRelatorios() {
  showLoader(true);
  try {
    // Período anterior para comparação
    let anoAnt = State.ano, mesAnt = State.mes - 1;
    if (mesAnt < 1) { mesAnt = 12; anoAnt--; }

    const [cats, centros, evol, evolCat, cmp, cap, car] = await Promise.all([
      run('getTotaisPorCategoria', State.ano, State.mes),
      run('getTotaisPorCentro',    State.ano, State.mes),
      run('getEvolucaoMensal',     6),
      run('getEvolucaoPorCategoria', 6, 5),
      run('getComparacaoPeriodos', anoAnt, mesAnt, State.ano, State.mes),
      run('getContasAPagar',   30),
      run('getContasAReceber', 30)
    ]);
    renderDonut_('categoria', '#chart-categoria', cats);

function renderEvolucaoCategorias_(data) {
  const canvas = $('#chart-evol-cat');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_charts.evolCat) { _charts.evolCat.destroy(); _charts.evolCat = null; }
  if (!data || !data.datasets || data.datasets.length === 0) return;

  const palette = ['#00c896','#4285f4','#f1c40f','#e53935','#9b59b6','#1abc9c','#34495e','#e67e22','#3498db','#95a5a6'];
  const datasets = data.datasets.map((d, i) => ({
    label: d.label,
    data: d.data,
    borderColor: palette[i % palette.length],
    backgroundColor: palette[i % palette.length] + '20',
    tension: 0.3,
    fill: false,
    borderWidth: 2
  }));

  _charts.evolCat = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels: data.labels, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtBRL(ctx.raw) } }
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => fmtBRL(v) } } }
    }
  });
}

function renderComparacao_(cmp) {
  const mesNomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const l1 = mesNomes[cmp.periodo1.mes - 1] + '/' + String(cmp.periodo1.ano).slice(2);
  const l2 = mesNomes[cmp.periodo2.mes - 1] + '/' + String(cmp.periodo2.ano).slice(2);
  $('#cmp-label-1').textContent = l1;
  $('#cmp-label-2').textContent = l2;

  const body = $('#cmp-body');
  body.innerHTML = '';
  const linhas = [
    ['Receitas', cmp.periodo1.receitas, cmp.periodo2.receitas, true],
    ['Despesas', cmp.periodo1.despesas, cmp.periodo2.despesas, false],
    ['Saldo',    cmp.periodo1.saldo,    cmp.periodo2.saldo,    true]
  ];
  linhas.forEach(row => {
    const [label, v1, v2, mais_melhor] = row;
    const delta = v2 - v1;
    const cls = delta === 0 ? '' : ((mais_melhor ? (delta > 0) : (delta < 0)) ? 'positive-val' : 'negative-val');
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + label + '</td>' +
      '<td class="right">' + fmtBRL(v1) + '</td>' +
      '<td class="right">' + fmtBRL(v2) + '</td>' +
      '<td class="right ' + cls + '">' + (delta >= 0 ? '+' : '') + fmtBRL(delta) + '</td>';
    body.appendChild(tr);
  });
}

function renderContasAPagar_(lancs) {
  const body = $('#cap-body');
  body.innerHTML = '';
  $('#cap-empty').classList.toggle('hidden', lancs.length > 0);
  lancs.forEach(l => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + fmtDate(l.data) + '</td>' +
      '<td>' + escapeHtml(l.descricao) + '</td>' +
      '<td class="right negative-val">' + fmtBRL(l.valor) + '</td>';
    body.appendChild(tr);
  });
}

function renderContasAReceber_(lancs) {
  const body = $('#car-body');
  body.innerHTML = '';
  $('#car-empty').classList.toggle('hidden', lancs.length > 0);
  lancs.forEach(l => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + fmtDate(l.data) + '</td>' +
      '<td>' + escapeHtml(l.descricao) + '</td>' +
      '<td class="right positive-val">' + fmtBRL(l.valor) + '</td>';
    body.appendChild(tr);
  });
}

function renderDonut_(key, selector, dados) {
  const canvas = $(selector);
  if (!canvas || typeof Chart === 'undefined') return;
  if (_charts[key]) { _charts[key].destroy(); _charts[key] = null; }
  if (!dados || dados.length === 0) return;

  const palette = ['#00c896','#4285f4','#f1c40f','#e53935','#9b59b6','#1abc9c','#34495e','#e67e22','#3498db','#95a5a6','#16a085','#c0392b'];
  const colors = dados.map((d, i) => d.cor || palette[i % palette.length]);

  _charts[key] = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: dados.map(d => d.nome),
      datasets: [{ data: dados.map(d => d.total), backgroundColor: colors, borderWidth: 1 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.label + ': ' + fmtBRL(ctx.raw) } }
      }
    }
  });
}

function renderEvolucao_(data) {
  const canvas = $('#chart-evolucao');
  if (!canvas || typeof Chart === 'undefined') return;
  if (_charts.evolucao) { _charts.evolucao.destroy(); _charts.evolucao = null; }

  _charts.evolucao = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: [
        { label: 'Receitas', data: data.receitas, borderColor: '#00a37c', backgroundColor: 'rgba(0,163,124,0.10)', tension: 0.3, fill: false, borderWidth: 2 },
        { label: 'Despesas', data: data.despesas, borderColor: '#e53935', backgroundColor: 'rgba(229,57,53,0.10)', tension: 0.3, fill: false, borderWidth: 2 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom' },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtBRL(ctx.raw) } }
      },
      scales: { y: { beginAtZero: true, ticks: { callback: v => fmtBRL(v) } } }
    }
  });
}

async function loadAuthConfig_() {
  try {
    const status = await run('getAuthStatus');
    $('#auth-cfg-email').textContent = status.email || '—';
    $('#auth-cfg-timeout').value     = status.timeout_minutes || 15;

    const users = await run('listAuthUsers');
    const body = $('#auth-cfg-users-body');
    body.innerHTML = '';
    if (!users || users.length === 0) {
      body.innerHTML = '<tr><td colspan="3" class="muted">Nenhum usuário ainda.</td></tr>';
    } else {
      users.forEach(u => {
        const tr = document.createElement('tr');
        const isMe = (u.email === AuthState.email);
        const created = u.created_at ? new Date(u.created_at).toLocaleString('pt-BR') : '—';
        tr.innerHTML =
          '<td>' + escapeHtml(u.email) + (isMe ? ' <span class="muted">(você)</span>' : '') + '</td>' +
          '<td>' + escapeHtml(created) + '</td>' +
          '<td class="right">' +
            (isMe ? '<span class="muted" style="font-size:12px">—</span>'
                  : '<button class="icon-btn" data-rm-user="' + escapeHtml(u.email) + '" title="Remover"><span class="material-icons-outlined">delete_outline</span></button>') +
          '</td>';
        body.appendChild(tr);
      });
      $$('#auth-cfg-users-body [data-rm-user]').forEach(btn => {
        btn.onclick = async () => {
          const email = btn.dataset.rmUser;
          if (!confirm('Remover acesso de ' + email + '?')) return;
          try {
            const r = await run('removeAuthUser', email);
            if (!r.ok) { setAuthCfgStatus_(r.error || 'Erro.', true); return; }
            setAuthCfgStatus_('Usuário removido.');
            await loadAuthConfig_();
          } catch (e) { setAuthCfgStatus_(e.message, true); }
        };
      });
    }
  } catch (e) {
    setAuthCfgStatus_('Erro carregando: ' + e.message, true);
  }
}

async function configAuthSaveTimeout_() {
  const m = parseInt($('#auth-cfg-timeout').value, 10);
  if (!m || m < 1) { setAuthCfgStatus_('Valor inválido.', true); return; }
  try {

async function configAuthChangePwd_() {
  const oldP = $('#auth-cfg-pwd-old').value;
  const newP = $('#auth-cfg-pwd-new').value;
  const newP2 = $('#auth-cfg-pwd-new2').value;
  if (!oldP || !newP) { setAuthCfgStatus_('Preencha senha atual e nova.', true); return; }
  if (newP.length < 4) { setAuthCfgStatus_('Nova senha precisa ter pelo menos 4 caracteres.', true); return; }
  if (newP !== newP2) { setAuthCfgStatus_('As novas senhas não coincidem.', true); return; }
  try {
    const r = await run('changeMyPassword', oldP, newP);
    if (!r.ok) { setAuthCfgStatus_(r.error || 'Erro.', true); return; }
    $('#auth-cfg-pwd-old').value = '';
    $('#auth-cfg-pwd-new').value = '';
    $('#auth-cfg-pwd-new2').value = '';
    setAuthCfgStatus_('Senha alterada com sucesso.');
    // Atualiza a sessão (a senha mudou, mas a identidade ainda é válida)
    _authSave_(AuthState.email);
  } catch (e) { setAuthCfgStatus_(e.message, true); }

// ============================================================================
// Export CSV utilitário
// ============================================================================

function downloadCSV_(filename, headers, rows) {
  const esc = (v) => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1 || s.indexOf(';') !== -1) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const lines = [headers.map(h => esc(h.label)).join(',')];
  rows.forEach(r => lines.push(headers.map(h => esc(r[h.key])).join(',')));
  // Adiciona BOM para Excel reconhecer UTF-8
  const csv = '﻿' + lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
